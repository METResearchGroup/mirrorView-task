[project]
name = "mirrorview-task"
version = "0.1.0"
description = "jsPsych mirror view experiment — tooling and static assets"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "atproto>=0.0.68",
    "duckdb>=1.0.0",
    "gdown>=5.2.0",
    "google-api-python-client>=2.187.0",
    "langchain>=1.2.17",
    "langchain-aws>=1.5.1",
    "langchain-openai>=1.2.1",
    "langdetect>=1.0.9",
    "matplotlib>=3.10.9",
    "pandas>=3.0.2",
    "praw>=7.7.0",
    "pyarrow>=20.0.0",
    "pydantic>=2.12.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.0",
    "research-tools",
    "tabulate>=0.10.0",
    "tenacity>=9.0.0",
    "tqdm>=4.66.0",
    "tweepy>=4.14.0",
    "typer>=0.25.0",
    "xgboost>=3.2.0",
    "zstandard>=0.25.0",
]

[project.optional-dependencies]
modernbert-training = [
    "torch>=2.12.0",
    "transformers>=5.8.1",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "scikit-learn>=1.8.0",
    "wandb>=0.26.1",
    "pyyaml>=6.0",
    "sagemaker>=2.240.0,<3",
    "boto3>=1.42.88",
]
bertopic = [
    "bertopic>=0.17.0",
    "openai>=1.0.0",
    "plotly>=5.0.0",
    "kaleido>=0.2.1",
]
finetune-qwen-2026-08-08 = [
    "torch>=2.12.0",
    "transformers>=5.8.1",
    "datasets>=3.0.0",
    "accelerate>=1.0.0",
    "peft>=0.14.0",
    "trl>=0.15.0",
    "scikit-learn>=1.8.0",
    "wandb>=0.26.1",
    "pyyaml>=6.0",
    "sagemaker>=2.240.0,<3",
    "boto3>=1.42.88",
    "pandas>=3.0.2",
]

[dependency-groups]
dev = [
    "boto3>=1.42.88",
    "joblib>=1.5.3",
    "pytest>=9.0.0",
    "questionary>=2.1.1",
    "rich>=14.0.0",
    "scikit-learn>=1.8.0",
    "spacy>=3.8.0",
    "torch>=2.12.0",
    "transformers>=5.8.1",
    "wandb>=0.26.1",
]

[tool.uv]
package = false
# research-tools → litellm 1.84 needs importlib-metadata>=8; sagemaker (modernbert-training) pins <7.
override-dependencies = ["importlib-metadata>=8.0.0,<9"]

[tool.uv.sources]
research-tools = { git = "https://github.com/METResearchGroup/research_tools.git" }

[tool.pytest.ini_options]
pythonpath = ["."]
