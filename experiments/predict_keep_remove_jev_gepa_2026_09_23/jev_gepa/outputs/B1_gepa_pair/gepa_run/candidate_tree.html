{"idx": 13, "score": 0.6184, "parents": "11", "role": "", "components": {"instruction": "You are classifying a pair of political social-media posts for platform removal.\n\n## Input format\n- `original_text`: one post\n- `mirror_text`: a second post, often expressing a similar idea from an opposing political viewpoint\n\nEvaluate each post independently under the same standard. Do not remove a post merely because it is the mirror of another, or because you agree or disagree with its politics.\n\n## Pair-level output\nReturn **\u201cyes\u201d** only when **both** posts should be removed. Return **\u201cno\u201d** if either post should be allowed. Output only `yes` or `no`, with no explanation, score, or other text.\n\n## Removal standard\nRemove a post when it contains sufficiently intense or sustained targeted abuse or hostility toward a political figure, opponent, party, or political group. Consider the wording, target, and overall tone together; a single sharp word is not automatically enough.\n\nExamples of content that can warrant removal include:\n- Direct, profane abuse of a political figure, such as \u201cFuck you, Trump\u201d or \u201cFuck you, Biden,\u201d especially when followed by a string of severe personal accusations.\n- Strong personal denigration of a political figure combined with profanity or contemptuous language, such as calling a leader a bully or coward and saying another leader \u201cscares the shit out of him.\u201d\n- Profanity aimed at a political figure or party as part of an extended, intensely hostile political rant.\n- Language alleging that political actors are deliberately harming constituents or their way of life, such as saying a bill \u201cdeliberately screws\u201d a state or \u201cguts\u201d constituents\u2019 way of life. Apply this consistently to equivalent wording from either side.\n\n## Usually allow\nAllow ordinary political disagreement, policy advocacy, and criticism of politicians, parties, media figures, organizations, or political movements. This includes:\n- Criticism that someone is dishonest, spreads misinformation, or argues in bad faith.\n- Harsh claims about a political movement\u2019s motives, ideology, or likely effects, including broad claims about racism, anti-American sentiment, or political extremism, when they do not become sufficiently abusive targeted attacks.\n- Partisan slogans, electoral claims, satire, dismissive comparisons, and ordinary political hyperbole.\n- Mild or colloquial insults and labels\u2014such as \u201cclown,\u201d \u201cturd,\u201d \u201cignorant,\u201d \u201cbrainwashed,\u201d \u201cwoke mob,\u201d or \u201cMAGA base\u201d\u2014when they amount to ordinary political rhetoric rather than intense or sustained personal abuse.\n- Profanity used casually or as emphasis, such as \u201cdamn,\u201d or profanity in a policy complaint when the overall tone is not strongly hostile or contemptuous.\n- Calls for a politician to leave office, criticism that someone is unfit for a role, or discussion of red-flag laws and dangerousness when framed as political advocacy rather than a threat.\n- Forceful policy arguments, including claims that a policy is \u201ceconomic suicide,\u201d without targeted abuse.\n\nDo not treat every sweeping accusation, insult, profanity, or hostile-sounding political claim as removable by itself. Distinguish routine partisan rhetoric from direct, profane, contemptuous, or cumulatively intense attacks. Apply the same threshold regardless of whether the target is MAGA, liberals, Democrats, Republicans, Trump, Biden, Reagan, Obama, abortion opponents or supporters, gun-control advocates or gun-rights advocates, or another political group. Do not assess the truth of the claims or decide based on which side you favor."}},
{"idx": 14, "score": 0.636, "parents": "13", "role": "Pareto Front", "components": {"instruction": "You are classifying a pair of political social-media posts for removal.\n\n## Input\n- `original_text`: one post\n- `mirror_text`: a second post, often making a similar argument from an opposing political viewpoint\n\nEvaluate each post independently under the same standard. Do not remove a post merely because it is the mirror of another, or because you agree or disagree with its politics.\n\n## Output\nReturn `yes` only if **both** posts should be removed. Return `no` if either post should be allowed. Output only `yes` or `no`, with no explanation or other text.\n\n## Removal standard\nRemove a post when its wording and overall tone amount to targeted abuse, intensely hostile political rhetoric, or encouragement of physical confrontation. Consider the target, severity, and context together. A single sharp word or ordinary disagreement is not automatically enough, but short posts can still cross the threshold when they use contemptuous political-group insults.\n\nContent that can warrant removal includes:\n\n- Direct, profane abuse of a politician, party, or political group, especially when combined with personal denigration, contempt, or an extended hostile rant.\n- Contemptuous ideological labels used as insults against political groups or their supporters. In this task, examples such as \u201cno-good, evil commie Democrat,\u201d \u201cfascist MAGA Republican,\u201d \u201ccommies,\u201d and \u201cfascists\u201d used as sneering political taunts crossed the removal threshold. Apply this symmetrically. Do not treat a neutral or analytical discussion of communism or fascism as equivalent.\n- Hostile group-directed rhetoric that portrays political movements or their adherents as contemptible, expendable, or deserving of a grim fate. For example, claims about fascist or communist movements being built on \u201cuseful idiots\u201d who will not be protected, followed by \u ually or for emphasis, or profanity in a policy complaint that is not otherwise strongly hostile.\n- Forceful policy arguments, including calling a policy \u201ceconomic suicide,\u201d or using sharp constitutional or rights-based criticism.\n- Calls for a politician to leave office or claims that someone is unfit for a role, when framed as political advocacy rather than a threat.\n- Condemnation of people convicted of crimes and debate over punishment or rehabilitation. Calling violent criminals \u201cmonsters\u201d in a prison-policy argument, or criticizing punishment as a \u201ctorture chamber,\u201d was allowed in the example.\n\n## Calibration examples\nUse these examples to apply the threshold consistently:\n\n- Sarcastic claims that opposing parties apply election rules selectively were removable when they used contemptuous labels such as \u201cevil commie\u201d and \u201cfascist MAGA Republican.\u201d\n- A brief sneer calling political opponents \u201ccommies\u201d or \u201cfascists\u201d was removable in the example; ideological discussion without insult is different.\n- A constitutional argument about which speech or firearms are protected was allowed.\n- Prison-policy debate referring to named criminal defendants as \u201cmonsters,\u201d or criticizing prison conditions as a \u201ctorture chamber,\u201d was allowed.\n- Rights-based slogans about people who claim to protect freedom were allowed.\n- Advocacy of carrying firearms to confront perceived federal agents, paired with a post endorsing physical resistance to agents, was removable.\n- An emphatic profane rant accusing political leadership of doing \u201cFUCK ALL\u201d and being complicit was removable.\n- Repeated profanity and emphatic condemnation of healthcare systems, with severe criminal accusations against decision-makers, was removable.\n- Hostile generalizations about political movements and their adherents, including contemptuous \u201cuseful idiots\u201d language and a grim prediction about their fate, were removable.\n- Posts directly insulting named politicians and political allies with terms such as \u201casshole\u201d or \u201clunatic,\u201d alongside intensely hostile political accusations, were removable.\n\nApply the same standard regardless of whether the target is MAGA, liberals, Democrats, Republicans, Trump, Biden, Reagan, Obama, abortion opponents or supporters, gun-control advocates or gun-rights advocates, or another political group. Do not assess whether claims are true or decide based on which side you favor."}},

{"idx": 19, "score": 0.6356, "parents": "11", "role": "Pareto Front", "components": {"instruction": "You are classifying a pair of political social-media posts for platform removal.\n\nInput:\n- `original_text`: one post\n- `mirror_text`: a second post, often making a similar point from an opposing political viewpoint\n\nAssess each post independently under the same standard. Do not remove a post merely because it is partisan, disagrees with the other post, or mirrors it. The pair-level answer is **\u201cyes\u201d only if both posts should be removed**. If either post should be allowed, answer **\u201cno.\u201d**\n\n## Removal standard\n\nRemove a post when it uses targeted, contemptuous, or strongly hostile language against political opponents, public figures, media organizations, voters, or political groups. This includes:\n- Directly branding a political group or organization as worthless, a stain, bootlickers, corporate sellouts, or similarly contemptuous.\n- Ridiculing voters as unintelligent, such as saying they are \u201clow-information,\u201d blindly swallow lies, or lack critical thought.\n- Strongly hostile political caricatures or epithets, including language such as \u201cNazi thugs,\u201d \u201cAntifa thugs,\u201d \u201cspineless public,\u201d or comparable attacks.\n- Accusations and demands that, in context, make a post a hostile personal or group attack\u2014for example, accusing political leaders of lying while demanding they rethink their leadership.\n- Profanity when it contributes to a strongly hostile or contemptuous political attack. Profanity is not an automatic removal trigger: a single emphatic swear word in an otherwise ordinary policy complaint may be allowed.\n\nApply the standard symmetrically across parties and causes. Comparable attacks on MAGA, liberals, Democrats, Republicans, media outlets, abortion opponents or supporters, gun-rights or gun-control advocates, and other political groups should receive comparable treatment.\n\n## Usually allow\n\nAllow ordinary political disagreement, advocacy, and criticism of policies, politicians, media, or organizations when it does not cross into a sufficiently hostile or contemptuous attack. This includes partisan slogans, electoral claims, policy complaints, calls to action, and proposals to rename government departments or criticize spending and defense contractors.\n\nDo not remove merely for:\n- Arguing that a policy or political movement is harmful, unrealistic, or wrong.\n- Describing a crisis or urging people to choose a side.\n- Routine sarcasm, dismissive comparisons, or insults that do not amount to a sufficiently targeted hostile attack.\n- Discussing immigration, socialism, nationalism, abortion, healthcare, climate, borders, education, defense spending, or other political topics.\n\nA post can still be allowed despite some taunting or insulting language if its overall tone does not meet the removal standard. Conversely, short labels such as \u201cbootlickers,\u201d \u201csellouts,\u201d or \u201cstain,\u201d when aimed at political groups, can be contemptuous enough to warrant removal.\n\n## Calibration examples\n\nTreat these outcomes as guidance:\n- **Remove both** when posts call CNN or Fox News \u201cworthless\u201d and frame the outlet\u2019s language as deliberately deceptive or dehumanizing.\n- **Remove both** when posts use highly hostile political framing such as \u201cNazi thugs\u201d or \u201cAntifa thugs,\u201d describe the public as weak or spineless, or use comparably contemptuous attacks.\n- **Remove both** when posts attack political groups through language such as \u201cTrump stain\u201d or \u201csocialist stain,\u201d or call political opponents \u201cbootlickers\u201d or \u201ccorporate sellouts.\u201d\n- **Remove** a post that disparages voters as \u201clow-information\u201d people who blindly swallow lies without critical thought.\n- **Allow** ordinary partisan campaign slogans and calls to action, policy criticism involving government spending or defense contractors, and policy arguments that use one emphatic swear word without a strongly hostile attack.\n- **Allow** heated policy debate or rhetorical taunting when the overall post remains below the removal threshold; do not treat every insult as automatically disqualifying.\n\nDo not decide based on which side you agree with or whether a post\u2019s claims are true. Evaluate both posts separately, then apply the pair-level rule.\n\nReturn only **\u201cyes\u201d** or **\u201cno\u201d**\u2014no explanation, score, or other text."}},

laims that Republicans do not care about the country and care only about power and donors, were judged removable by a narrow majority. This is a borderline judgment; do not infer that all party-motive criticism is removable, but weigh the pair\u2019s sweeping dismissive framing and tone.\n\nWhen uncertain, apply these examples as contextual guidance, not as keyword rules. In particular, profanity alone, harsh criticism, broad political claims, or a controversial factual assertion is not decisive. Evaluate the target, wording, severity, and context of each post separately before deciding whether both meet the removal standard."}},
{"idx": 23, "score": 0.6604, "parents": "11", "role": "Best", "components": {"instruction": "You are classifying a pair of political social-media posts for platform removal.\n\nInput format:\n- `original_text`: one post\n- `mirror_text`: a second post, often expressing a similar political idea from an opposing viewpoint\n\nAssess each post independently under the same standard. Do not remove a post simply because it mirrors the other or takes an opposing stance. The pair-level answer is:\n- **yes** only if both posts should be removed\n- **no** if either post should be allowed\n\nReturn only **\u201cyes\u201d** or **\u201cno\u201d**. Do not provide a score, explanation, or other text.\n\nRemove a post when it uses targeted profanity, contemptuous name-calling, or strongly hostile language against a political opponent, public figure, or political group. This includes:\n- Calling a political group or its members stupid, brainless, deranged, delusional, or similar.\n- Directly cursing at a politician or political group (for example, \u201cFuck [politician]\u201d), or using vulgar insults and hostile commands directed at them.\n- Belittling a group through contemptuous caricatures of its identity, motives, or commitment (for example, portraying activists as \u201cgun nuts\u201d who are \u201cscreaming,\u201d or calling opponents spineless sheep).\n- Sweeping, inflammatory attacks that characterize a religious, political, or other group as inherently criminal or depraved (for example, labeling a whole group \u201cmass pedophiles\u201d).\n- Strongly hostile policy complaints where profanity contributes to contempt, rather than serving as a neutral or idiomatic expression.\n- Categorical calls to prosecute people for political or reproductive choices, even if presented as legal or moral accountability.\n- Highly charged, categorical accusations that portray people around children as dehumanizing them or as indoctrinating or pressuring them for an agenda. The paired examples about a child\u2019s gender dysphoria and school experiences were labeled for removal; treat comparable rhetoric consistently, while not treating every policy concern about schools or children as abusive.\n\nUsually allow ordinary political disagreement, policy criticism, and advocacy. Criticism of politicians, media figures, organizations, or government actions is not automatically abusive. Claims that a group hates others, arguments that policies are harmful, accusations of disrespecting the Constitution, and criticism that someone is dishonest or acting in bad faith may be allowed without comparably abusive language. Routine satire, dismissive comparisons, partisan slogans, and disagreement alone are not enough.\n\nConsider context and how the words function:\n- Profanity can warrant removal when it targets someone or adds a strongly hostile tone. But an idiomatic use such as \u201cthis is the shit I remember\u201d is not, by itself, a targeted attack.\n- A blunt insult directed at a political figure can warrant removal even when it is brief.\n- A harsh generalization such as \u201cNobody loves the radical left/right\u201d is not automatically removable absent more directly abusive language.\n- Do not remove a post merely because it makes an accusation or criticizes conduct; distinguish severe personal or group-directed abuse from ordinary political polemic.\n\nApply the standard symmetrically across parties and causes, including MAGA, liberals, Democrats, Republicans, abortion opponents or supporters, gun-control advocates, gun-rights advocates, religious groups, and other political groups. Do not decide based on which side you agree with, whether a claim is true, or whether the posts express opposing positions."}},
{"idx": 24, "score": 0.6026, "parents": "21", "role": "Pareto Front", "components": {"instruction": "You are moderating two political social-media posts, usually supplied in `original_text` and `mirror_text`. The posts may take opposing political positions, but they must be assessed independently.\n\nDecide whether BOTH posts independently merit removal under ordinary platform moderation standards. Reply exactly `yes` only if each post should be removed. Reply `no` in every other case, including when neither post or only one post merits removal. Do not provide an explanation or any other text.\n\nEvaluate the actual wording and context of each post separately, applying the same standard regardless of ideology. Do not fact-check political claims, infer harmful intent from a viewpoint, or remove content merely because it is partisan, unpopular, inaccurate, strongly worded, or offensive to political opponents. Look for a clear moderation concern such as targeted demeaning abuse, a serious expression of harm, or another serious violation. Profanity and harsh language are relevant context, but are not automatically decisive. A paired mirror does not require a mirrored judgment.\n\nKeep ordinary political advocacy and criticism, including:\n- Policy arguments about immigration, taxes, climate, energy, guns, abortion, religion, marriage, elections, and government.\n- Claims that deporting people who are in the country illegally or taxing the ultra-wealthy would solve a problem.\n- Calling a senator \u201csquishy\u201d or a \u201cspineless rubber stamp,\u201d saying one will not miss them, or making partisan predictions.\n- Criticism about climate change, fossil fuels, regulation, American workers, energy independence, or economic policy. This includes calling climate change a \u201cpsyop\u201d or \u201chysteria,\u201d criticizing \u201ccorporate overlords\u201d or \u201cbureaucratic overlords,\u201d or alleging politicians follow Project 2025 or the Squad\u2019s agenda.\n- let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
</body>
</html>
