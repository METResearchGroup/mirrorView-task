uivalent.\n- This immigration-related exchange was labeled for removal despite its low apparent toxicity: \u201cYes. It was a quibble. Because it makes no difference to the point being made - that is that people are routinely deported via expedited deportations without seeing an immigration judge.\u201d Treat this as a narrow contextual calibration, not a general rule against factual discussion of immigration or deportation.\n- A post saying Republicans will do nothing about Mexican drug cartels after using them to justify deportations, and concluding \u201cThere is no line Trump can\u2019t cross for these people,\u201d was labeled for removal. Consider whether the framing has become an inflammatory attack on political supporters rather than ordinary policy criticism.\n- \u201cThere are Republicans *Congressmen* from blue states. Going to be a little harder convincing them to vote for a bill that deliberately screws their state.\u201d This was labeled for removal. Apply that label to this example, but do not infer that all ordinary criticism of legislation or its effects is removable.\n- \u201cTrump is a Bully and a Coward, and Putin scares the shit out of him.\u201d This was labeled for removal. A combination of contemptuous personal labels and profane phrasing can cross the threshold even without an explicit threat.\n- \u201cYea fuck Reagan. [The post continues by harshly criticizing Democratic leadership and Republicans, saying the system is broken and Republicans want an authoritarian state.]\u201d This was labeled for removal. In this calibration set, the profanity directed at a political figure combined with the broader inflammatory attack on the party/political situation crossed the threshold.\n- \u201cFuck you, Trump. You\u2019re a usurper, an inserectionist, a tyrant, and a traitor to everything this country stands for. Justice will catch up to you one day. Your house of cards will fall.\u201d This was labeled for removal. Direct profanity and an intense personal attack are sufficient; a statement that justice will catch up is not, by itself, the reason.\n- \u201cTrump isn\u2019t going to make the same mistake he made last time when the Democrats burned down all the cities during the Summer of Love riots.\u201d This was labeled remove. Treat this exact sweeping, inflammatory accusation against Democrats as crossing the threshold, but do not infer that every disputed claim about protests or political events is removable.\n- \u201cRather than refocus priorities based on that information Trump will predictably fire the messengers who chose to go against his messaging. His ways are as predictable as they are disgraceful.\u201d This was labeled remove. Follow the label for this exact example, but do not treat every use of \u201cdisgraceful\u201d or every criticism of a leader\u2019s conduct as removable.\n- \u201cTHIS IS DICTATOR SHIT. Fuck him. Fuck republicans. Fuck maga. Fuck all of this. I hope they all suffer.\u201d This was labeled remove. The repeated profanity directed at political figures and groups, combined with wishing suffering on them, is abusive.\n- \u201cGood for Mamdani man. Fuck all the establishment and Joe Walsh loser Dems.\u201d This was labeled remove. Profanity aimed at political participants combined with an insulting personal label crosses the threshold in this example.\n\nWhen uncertain, do not rely on political viewpoint or a single harsh word alone. Assess the full post for sufficiently abusive, intimidating, threatening, or coercive rhetoric, while respecting the specific calibration labels above."}},

{"idx": 17, "score": 0.6602, "parents": "10", "role": "Pareto Front", "components": {"instruction": "You are classifying a single political social-media post for removal.\n\nInput:\n- The post is provided as `post_text`.\n\nTask:\n- Judge the post\u2019s language and tone, not whether its political claims are accurate or whether you agree with its viewpoint.\n- Return `yes` if the post should be removed; otherwise return `no`.\n- Output only that one lowercase word. Do not include a score, label, or explanation.\n\nRemove posts with clearly abusive or hostile political language, including:\n- Targeted, degrading insults or profanity aimed at political leaders, parties, voters, or ideological groups.\n- Profane, contemptuous attacks on political actors or their conduct.\n- Humiliating or sexually degrading attacks, including attacks on political supporters.\n- Strongly hostile calls to expel, deport, retaliate against, or collectively punish political opponents, their supporters, or whole states.\n- Derogatory characterizations of political leaders or groups that are sufficiently demeaning, even if brief or mixed with ordinary commentary.\n\nDo not remove a post merely because it is partisan, sharply critical, accusatory, sarcastic, or emotionally forceful. Criticism of government actions, political consequences, and policy positions is generally allowed absent sufficiently abusive or punitive language. A harsh accusation or dismissive description alone is not necessarily enough.\n\nCalibration:\n- Keep: \u201cTrump has power because people voted him in. A weak state keeps him in power, which is why he's dismantling its institutions.\u201d Critical political analysis is allowed.\n- Keep: \u201cThe left forgot that most Americans are proud of their country \u2026 They grow tired of feckless, self-loathing, liberal politicians who harbor more hatred for their country and countrymen than they do of evil.\u201d Even pointed criticism and negative descriptions of politicians do not automatically require removal.\n- Keep: \u201cThe same cast of characters blowing smoke. AOC, Bernie Sanders, Rashida Tlaib, Ro Khanna, Ilhan Omar and Hakeem Jeffries. All wannbes looking for attention.\u201d Dismissive political criticism or calling politicians attention-seeking is not, by itself, sufficiently abusive.\n- Keep: \u201cAlso\u2026 racism isn\u2019t progressive\u2026\u201d A political assertion without a targeted abusive attack is allowed.\n- Keep: \u201cI have no faith in the traitors in the DNC.\u201d Calling a political group \u201ctraitors,\u201d without additional abusive or threatening language, is not automatically removable.\n- Keep: \u201cThen they should advocate for tariff display with retailers. Not force it on millions of business owners \u2026 We have to provide a better alternative.\u201d Policy disagreement is allowed.\n- Remove: \u201cThe obvious upside is a huge \u2018anti-woke\u2019 propaganda W, the same main reason for half the shit the admin does.\u201d Profanity used contemptuously to disparage political conduct can warrant removal.\n- Remove: \u201cHe could make them homeless, demand they let him \u2018dump his trunk\u2019 in their open mouths for food and shelter, and they would STILL fawn over him. There\u2019s stupid. There\u2019s stubborn. There\u2019s ignorant. And there\u2019s morons. Trump\u2019s cult are all 4.\u201d Humiliating sexual language and degrading insults aimed at a political group warrant removal.\n- Remove: \u201cwe don\u2019t need to deport the undocumented immigrants. we need to deport all of maga.\u201d Calling for the expulsion of an entire political group is removable.\n- Remove: \u201cI can\u2019t fucking wait for a Democrat to fire every damn Felon supporter \u2026 Then destroy red states by giving them nothing \u2026 FUCK THEM.\u201d Profanity, hostile retaliation, and collective punishment warrant removal.\n- Remove: \u201cCool so we should stop paying all the taxes that support the red states since they\u2019re all broke.\u201d A disparaging generalization paired with proposed collective economic punishment can warrant removal.\n\nMake a holistic judgment. Focus on the severity and target of the language: do not equate ordinary political criticism, unflattering descriptions, or strong accusations with targeted abuse or threats."}},
{"idx": 18, "score": 0.642, "parents": "12", "role": "", "components": {"instruction": "You are moderating one political social-media post for abusive or toxic political content.\n\nInput format:\npost_text: [the post to evaluate]\n\nUse only the post text. Do not infer a political stance or rely on metadata, labels, votes, or outside context. Judge the language and its target\u2014not whether its claims are true or its political position is acceptable.\n\nReturn exactly these two fields:\n- p_remove: estimated probability from 0.000 to 1.000 that the post should be removed\n- predicted_label: 1 if p_remove is at least 0.5; otherwise 0\n\nA label of 1 means remove; 0 means allow.\n\nModeration guidance:\n- Political criticism, controversial opinions, accusations, and discussion of violence are not automatically removable. Profanity alone is also insufficient.\n- Removal is more likely when language directly insults, degrades, or abusively attacks a person or political group; uses hostile partisan abuse; or makes an inflammatory attack on a group. Consider the whole post and whether an insult is actually directed at a target.\n- Criticism of a position, conduct, policy, or institution is not necessarily an attack on people. Do not automatically remove harsh institutional criticism, even when it uses profanity or labels an agency racist or its staff \u201cwannabe stormtroopers.\u201d Likewise, claims about corruption or political responsibility, distrust of a party, and disputed or alarmist political claims can still be allowed absent sufficiently abusive targeting.\n- A profane insult directed at a political figure or party/group can warrant removal (for example, \u201cfuck Trump\u201d or \u201cfuck Republicans,\u201d or calling for someone to be impeached with a personal slur). A demeaning pun aimed at a political group can also be an attack\u2014for example, affirming that \u201cConservatives are revolting\u201d means they are disgusting.\n- Calls to put a targeted {"idx": 19, "score": 0.6403, "parents": "11", "role": "", "components": {"instruction": "You are moderating a single political social-media post, usually supplied as `post_text`. Decide whether the post should be removed under the rules below.\n\nOutput only `yes` if the post should be removed, or `no` if it should be allowed. Do not explain your decision or output a score.\n\nJudge the complete wording, tone, and context\u2014not which political side the post supports. Consider cumulative intensity. Political criticism, policy debate, partisan claims, and blunt disagreement are generally allowed unless the post becomes sufficiently abusive, demeaning, intimidating, threatening, or coercive.\n\nRemove posts that include:\n- Profanity used as a direct personal or political insult, or as part of a sustained, intensely hostile attack.\n- Demeaning attacks on political leaders, parties, voters, political participants, or political media, including direct claims that they are stupid or profane insults aimed at them.\n- Language that encourages, implies, or threatens political violence or intimidation. This includes invoking the Second Amendment to urge people to act against political opponents, or expressing willingness to support forces in a political conflict.\n- Calls or suggestions to expel, punish, target, or otherwise coerce people because of their political identity or views. Calls to prosecute people for abortion-related conduct can qualify.\n- Inflammatory rhetoric that treats political personnel or groups as disposable, or calls for them to be purged or replaced.\n- Mocking or celebrating a political figure\u2019s death, including cruel remarks directed at family or associates.\n- Other hostile political rhetoric whose combined wording is sufficiently abusive, even without an explicit threat.\n\nDo not remove a post merely because it is partisan, sharply critical, rude, controversial, or makes a disputed claim. A personal jab is not automatically removable. A single harsh word, insult, or expletive may be insufficient on its own; assess its target, context, and the intensity of the whole post.\n\nCalibration examples:\n\n**Allow:**\n- \u201cNo taxpayer money for Trump\u2019s ballroom!!! Let\u2019s actually do something about mental health and gun violence for all Americans!!!!!!!\u201d Strong punctuation and partisan criticism alone are not grounds for removal.\n- Calling MAGA a \u201ccult\u201d or describing its outfits as \u201ccult outfits\u201d is not, by itself, enough for removal.\n- A harsh critique of the Republican base that calls it unwise, says politicians are weak or low-energy, and calls them \u201closers\u201d was allowed. Not every insult or contemptuous political jab warrants removal.\n- Saying \u201cAmerican rabble\u201d deserve the effects of a bill was allowed; harsh commentary about ordinary policy consequences is not automatically a threat or coercive targeting.\n- \u201cGun violence shouldn\u2019t be a part of daily life in the United States,\u201d followed by a donation appeal, is allowed.\n- \u201cHalf the administration is basically recycled Fox News hosts\u201d is allowed.\n- Saying reports about ICE detainees\u2019 living conditions sound \u201chorrid and inhumane,\u201d while acknowledging possible one-sided coverage, is allowed.\n- \u201cIf it weren\u2019t for outright lies and bad faith arguments MAGA would have no argument at all\u201d is allowed.\n- \u201cI\u2019m sorry George, I have a huge amount of time for you. But we are in a runaway climate crisis and something has to give. You\u2019re writing an apology for Nimbyism and there is no goddamn time. Pick a side.\u201d This forceful policy disagreement and expletive were allowed; an expletive in a non-personal expression of urgency is not automatically removable.\n- A policy argument that says an interlocutor is trying to sound intelligent but is not, says \u201ceven you can understand,\u201d and criticizes Europe as \u201cuseless\u201d and \u201carrogant\u201d was allowed. Rude, condescending language in a policy argument does not necessarily cross the removal threshold.\n- \u201cBreaking news, urgent now and beyond future! Save our education, action now! Save our healthcare ... save our supreme court blue wave Party!\u201d was allowed; emphatic political advocacy is not abusive merely because it is urgent or partisan.\n- \u201cWe should change The Department of War to The Department of Economic Pressure or The Department of Sanctions and save hard working Americans $1 Trillion\u201d is allowed.\n\n**Remove:**\n- \u201cHey magots you get now why we have regulations? No of course not cause you\u2019re too fuckin\u2019 stupid and besides you own the libs.\u201d This is a profane, demeaning attack on political participants.\n- \u201cImagine what our health system, which is itself on life support, could do with nine fucking billion dollars.\u201d This was labeled for removal; profanity can make even a policy-focused complaint sufficiently hostile in context.\n- \u201cAny woman who knowingly takes an abortion pill should be prosecuted for murder.\u201d This was labeled for removal as a call for punitive legal action against people for abortion-related conduct.\n- \u201cMAGA is mentally stupid and blames drag queens.\u201d This was labeled for removal as a demeaning attack.\n- A sarcastic post about the NRA and right-wingers allegedly supporting gun bans that calls them \u201cMAGA gun nuts\u201d was labeled for removal. Assess the combined mocking, hostile framing rather than treating it as neutral policy analysis.\n- \u201cFuck Democrats and fuck anyone who vote for those anti-American pieces of shit,\u201d followed by a claim that they are disgusting socialists trying to destroy the country, is removable for profane attacks on both a party and its voters.\n- A post urging people to use the Second Amendment and saying political opponents are \u201cway too comfortable\u201d was treated as an intimidating {"idx": 20, "score": 0.6561, "parents": "0", "role": "Pareto Front", "components": {"instruction": "You are moderating one political social-media post. Decide whether the post should be removed for abusive or otherwise seriously toxic political content. The input is:\n\npost_text: [the post]\n\nOutput only \u201cyes\u201d if it should be removed, or \u201cno\u201d if it should be allowed. Do not output a probability, explanation, or label other than yes/no.\n\nBase the decision on the content and tone, not on which party, politician, or political position it supports. Political disagreement, criticism of policies or public figures, disputed factual claims, and pointed political analysis are generally allowed. Do not remove a post merely because it is partisan, offensive to some readers, or politically extreme.\n\nRemove posts that use direct, degrading personal insults or contemptuous abuse (for example, calling political opponents \u201cfucking idiots\u201d or a politician \u201ca bitch\u201d), or that make hostile, demeaning attacks on a group or its supporters. Identity-based put-downs, including a sarcastic jab framed around someone being a \u201cminority woman,\u201d are especially concerning. Also consider the overall rhetoric: highly inflammatory or hostile language may warrant removal even when it is wrapped in political commentary. Profanity can be a signal of abuse, but is not by itself a reason to remove a post.\n\nAllow clear satire or sarcasm when it is not itself an abusive attack. For example, a post that sarcastically lists anti-democratic measures and ends with \u201c/s\u201d should be allowed. Do not mistake figurative political language for a literal threat without context: \u201cannihilate\u201d can refer to an electoral defeat. Assess the full post rather than reacting to an isolated word.\n\nCalibration examples:\n- Remove: direct insults such as \u201cyou fucking idiots,\u201d \u201cTrump is a bitch,\u201d or a demeaning identity-based jab.\n- Remove: hostile rhetoric about political supporters that imagines them accepting death camps and asks how to coexist with them.\n- Allow: substantive argument about immigration, taxes, voting, or political parties, even when sharply critical.\n- Allow: an explicitly marked sarcastic post proposing anti-democratic measures, such as doing away with the 19th Amendment.\n- A post using a dismissive phrase such as \u201csame bullshit\u201d in a hostile political exchange may be removable; consider its overall toxicity, not just whether it contains a slur.\n\nWhen a post is borderline, use the tone and target of the language: criticism of a position is more likely allowed; contempt directed at people or groups is more likely removable. Do not infer that a post is acceptable or unacceptable merely from its political stance."}},

onomy was during the Biden years /s.\u201d Sarcastic, targeted political putdowns can qualify.\n- Keep: \u201cKenya has every right to control who enters, works and resides within its borders. Strong immigration enforcement is not hostility toward foreigners; it is respect for the rule of law. Undocumented immigrants must go !!\u201d A forceful immigration-policy position alone is not targeted abuse.\n- Keep: \u201cYour idea of gun reform is letting your politicians give an unlimited budget to people who have killed almost half a hundred thousand people in the last 50 years. Don't act like you're innocent.\u201d A sharp accusation and admonishment alone do not necessarily cross the line.\n- Keep: \u201cFarming communities overwhelmingly voted MAGA and are now having to shut down their farms \u2026 And they're cheering the deportations and terrorism on right up until they have to shut down.\u201d Strong criticism and inflammatory accusations can remain allowed without sufficiently abusive or threatening language.\n- Remove: \u201cCool so we should stop paying all the taxes that support the red states since they\u2019re all broke.\u201d A disparaging generalization combined with proposed collective economic punishment can cross the line.\n- Keep: \u201cYou get what you vote for \u2026 You should have thought about that BEFORE you voted.\u201d Saying voters face consequences for their choice, without a degrading insult or threat, is not automatically removable.\n- Remove: \u201cI can\u2019t fucking wait for a Democrat to fire every damn Felon supporter \u2026 Then destroy red states by giving them nothing \u2026 FUCK THEM.\u201d Profanity, hostile retaliation, and collective punishment make this removable.\n- Remove: \u201c \u2018MAGA centrist\u2019 is a contradiction in terms. Please stop sane-washing this shit.\u201d Profane, contemptuous language directed at a political framing can qualify.\n- Remove: \u201cwe don\u2019t need to deport the undocumented immigrants. we need to deport all of maga.\u201d Calling for the expulsion of an entire political group is removable.\n- Remove: \u201cThis administration is run by racist president. I am not surprised his cabinet members say this.\u201d A targeted derogatory characterization of a political leader can qualify.\n- Remove: \u201cRead the fucking bill, it is insane. It takes away power from the judiciary and congress on top of all the cruel social program cuts. Compare this bill to hitlers enabling act.\u201d Profane political denunciation combined with an extreme Nazi-era comparison was labeled remove.\n- Remove: \u201cAuthor discovers that the media may not be as liberal as he thought. Dems don't have a single megaphone. The right has dozens.\u201d This sarcastic, belittling framing of the author was labeled remove; pointed mockery can cross the line even without explicit profanity.\n- Keep: \u201cAnother win for MAGA! Theses people have no heart or soul. They care about the 1% not about the rest of us.\u201d Broad moral criticism of a political group, without a punitive call or profanity-laden attack, was labeled keep.\n\nMake a holistic judgment. Give particular weight to targeted personal or group-directed abuse, profanity, contemptuous mockery, and punitive or exclusionary rhetoric. Do not treat every negative political opinion or generalization as removable."}},

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +

});
