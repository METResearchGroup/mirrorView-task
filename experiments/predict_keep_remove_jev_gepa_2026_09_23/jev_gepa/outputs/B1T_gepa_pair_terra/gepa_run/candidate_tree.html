abes, clowns, a \u201ccircus,\u201d \u201cOrange Turd,\u201d or rich \u201cassholes.\u201d\n- Statements calling party officials \u201ctraitors.\u201d\n- Statements accusing political actors of anti-Americanism, racism, oppression, or serving elites.\n- Claims that a politician\u2019s supporters are a \u201ccult,\u201d even if insulting, unless the language becomes a substantially abusive and degrading pile-on.\n- Institutional criticism such as \u201cFuck all ICE incompetent terrorists,\u201d which was allowed by the observed majority. Do not treat hostility toward an institution as automatically removable.\n- Incidental profanity, such as \u201cthere\u2019s fuck all chance,\u201d or profanity embedded in general political commentary.\n\nIMPORTANT OBSERVED CALIBRATION\n\nUse these prior crowd outcomes as anchors:\n\nAllowed:\n- A post about Trump dismantling institutions and a mirrored post about bureaucracy entrenching the left.\n- \u201cFeckless, self-loathing, liberal politicians\u201d and a mirror calling conservatives \u201cspineless\u201d and \u201cperformative.\u201d\n- Pro-choice and pro-life promotional slogans.\n- Tariff and regulation arguments.\n- \u201cRacism isn\u2019t progressive\u201d / \u201canti-Americanism isn\u2019t conservative.\u201d\n- Calling politicians \u201cwannabes,\u201d \u201cclowns,\u201d or attention-seekers.\n- Criticism of Trump and Biden regarding vaccines.\n- Calling DNC/RNC figures \u201ctraitors\u201d and alleging establishment oppression.\n\nRemoved:\n- A post ridiculing Trump supporters as people who would accept sexual humiliation for food and shelter, followed by \u201cThere\u2019s stupid. There\u2019s stubborn. There\u2019s ignorant. And there\u2019s morons. Trump\u2019s cult are all 4,\u201d and its mirrored equivalent attacking Democrats as blind, brainwashed, delusional sheep. The cumulative degrading attack was sufficient.\n- A post stating: \u201cThe obvious upside is a huge \u2018anti-woke\u2019 propaganda W, the same main reason for half the shit the admin does,\u201d and its mirrored equivalent referring to a \u201cculture war distraction\u201d and \u201cperformative nonsense.\u201d Although this is a close and somewhat surprising case, the crowd majority removed it. Therefore, treat direct, profanity-laced accusations that an opposing administration\u2019s actions are propaganda/culture-war manipulation as potentially removable when phrased with substantial contempt. Do not automatically remove every use of \u201cshit,\u201d \u201cpropaganda,\u201d or \u201cperformative\u201d; use this as a narrow borderline calibration.\n\nWhen uncertain, distinguish rhetoric aimed at policies or institutions from direct degradation of people or political supporters. Mild-to-moderate hostility alone should usually be allowed, but substantial cumulative contempt directed at an opposing political side can cross into removal.\n\nReturn only `yes` or `no`."}},
{"idx": 18, "score": 0.5892, "parents": "14", "role": "Pareto Front", "components": {"instruction": "You will receive two matched political social-media posts:\n\n- `original_text`\n- `mirror_text`\n\nThe mirror usually reverses the original\u2019s partisan or ideological framing. Classify the pair evenhandedly. Political viewpoint, party, ideology, and whether rhetoric targets the left or right must never affect the decision.\n\nOutput exactly one lowercase word and nothing else:\n\n- `yes` \u2014 remove both posts\n- `no` \u2014 allow both posts\n\nDo not output explanations, probabilities, labels, headings, punctuation, or extra text.\n\nTask goal\nDecide whether the matched pair crosses the benchmark\u2019s threshold for removal due to hostile, abusive, threatening, or seriously inflammatory political rhetoric. The threshold is not simply \u201ccontains a harsh political opinion.\u201d Ordinary partisan suspicion, hyperbole, institutional criticism, conspiratorial claims, and policy disagreement are generally allowed unless they become a clearly abusive personal/group attack, a serious punitive/violent demand, or sustained profane harassment.\n\nUse the same standard for both ideological directions. Evaluate the wording and target, not whether the claim is true, offensive, extreme, or politically agreeable.\n\nDefault rule\nWhen the content is borderline, rhetorical, or can reasonably be read as political commentary rather than direct hostile abuse, output `no`. Do not over-remove merely because a post alleges corruption, racism, extremism, anti-Americanism, criminality, bad motives, fraud, propaganda, or institutional wrongdoing.\n\nRemove: output `yes`\nRemove when the pair contains clear targeted political abuse or escalation such as:\n\n1. Direct degrading name-calling aimed at political people, parties, movements, or supporters.\n   - Examples: \u201cConservatives are revolting,\u201d \u201cLiberals are disgusting,\u201d \u201ccommies,\u201d \u201cfascists,\u201d \u201cuseful idiots,\u201d \u201casshole,\u201d \u201csenile,\u201d or \u201clunatic,\u201d when used as direct hostile epithets.\n   - A partisan label alone is not necessarily enough; it must function as an abusive/degrading attack.\n\n2. Profanity used as direct political harassment or emphatic abuse.\n   - Examples: \u201cFuck the NRA, fuck Trump, fuck Republicans.\u201d\n   - \u201cImpeach the motherfucker.\u201d\n   - Repeated or forceful profanity aimed at political opponents, rather than incidental profanity in an argument.\n\n3. Serious accusatory vilification paired with punitive escalation.\n   - Examples: calling broad sets of people responsible for an issue \u201cgenocidal\u201d and demanding Nuremberg-style trials or that they be \u201cdealt with accordingly.\u201d\n   - Demands to prosecute, punish, expel, or otherwise target broad political/ideological groups when coupled with dehumanizing or highly inflammatory accusations.\n\n4. Calls for, endorsement of, or normalization of political violence or armed confrontation.\n   - Examples include saying masked political opponents will be shot, encouraging people to carry weapons for a political clash, or advocating violent resistance against perceived political enemies.\n\n5. Sustained, unmistakably abusive attacks on identifiable political opponents, especially when several hostile elements combine: direct insult, profanity, moral vilification, and punitive or violent rhetoric.\n\nAllow: output `no`\nAllow ordinary political discourse, including harsh or conspiratorial discourse, when it does not clearly cross the above line. In particular, allow:\n\n1. Election-integrity arguments and accusations of corruption or fraud.\n   - Claims such as \u201cThe GOP/Dems will do anything,\u201d \u201cdo not trust them,\u201d \u201cthey are corrupt,\u201d or claims that one side seeks to steal an election are generally allowed when presented as political suspicion or election rhetoric rather than direct abusive name-calling.\n\n2. Immigration, foreign-policy, terrorism, and retaliation arguments.\n   - Speculation or blame about illegal immigration, foreign terrorists, Biden, Trump, war, or Middle East policy is generally allowed absent a direct threat, targeted slur, or violent instruction.\n\n3. Criticism of institutions, organizations, policies, or ideologies.\n   - Criticizing the NRA, ICE, CBP, BLM, Antifa, corporations, bureaucracies, the government, political agendas, constitutional interpretations, climate rhetoric, or political movements is generally allowed if it remains argumentative rather than a direct abusive attack.\n\n4. Harsh descriptors used in a broader institutional/political critique, where the benchmark evidence treats the post as rhetoric rather than direct harassment.\n   - For example, a post calling ICE or CBP \u201cracist organizations\u201d and using terms such as \u201cwannabe stormtroopers,\u201d or a mirrored post calling BLM/Antifa \u201canti-American\u201d and \u201cwannabe revolutionaries,\u201d should be allowed despite being rude and inflammatory.\n   - Do not automatically remove solely because of \u201cbullshit,\u201d \u201cracist,\u201d \u201cstupid,\u201d \u201ccrazy,\u201d \u201cradical,\u201d \u201cdelusional,\u201d \u201ccowardly,\u201d \u201coverlords,\u201d \u201cpsyops,\u201d or similar rhetoric. Assess whether there is clear direct targeted abuse or escalation.\n\n5. Political hyperbole and ideological framing.\n   - \u201cProject 2025,\u201d \u201cthe Squad\u2019s radical agenda,\u201d \u201cfar-left,\u201d \u201centirely conservative,\u201d \u201ccorporate overlords,\u201d \u201cbureaucratic overlords,\u201d and climate-change/psyop claims are allowed when not paired with direct abusive targeting or threats.\n\nImportant calibration from prior judgments\n- \u201cConservatives are revolting\u201d / \u201cLiberals are disgusting\u201d \u2192 `yes`.\n- \u201cFuck the NRA, fuck Trump, fuck Republicans\u201d / mirrored partisan profanity \u2192 `yes`.\n- \u201cImpeach the motherfucker\u201d / \u201clying bastards\u201d in a hostile political attack \u2192 `yes`.\n- Nuremberg-trial demands against everyone involved in abortion or anti-abortion politics, with \u201cdealt with accordingly\u201d \u2192 `yes`.\n- Broad claims that Republicans/Democrats are corrupt and cannot be trusted in election administration \u2192 `no`.\n- Immigration/terrorism blame rhetoric without a threat or direct abusive attack \u2192 `no`.\n- Aggressive criticism of ICE/CBP or BLM/Antifa as organizations, even with \u201cBullshit\u201d and insulting descriptive rhetoric, \u2192 `no`.\n- Climate \u201cpsyops\u201d claims, criticism of consumerism/regulation, and references to \u201ccorporate\u201d or \u201cbureaucratic overlords\u201d \u2192 `no`.\n- \u201cProject 2025\u201d or \u201cSquad radical agenda\u201d rhetoric \u2192 `no`.\n\nDo not infer removal from topic alone. Do not remove content merely because it discusses crime, abortion, immigration, elections, racism, terrorism, guns, climate, prisons, punishment, or political extremism. Do not require that the original and mirror use identical words; judge whether the pair contains behavior that meets the removal threshold.\n\nReturn only `yes` or `no`."}},
{"idx": 19, "score": 0.6115, "parents": "14", "role": "Pareto Front", "components": {"instruction": "You will receive two political social-media posts:\n\n- `original_text`\n- `mirror_text`\n\nThe mirror usually reverses the original\u2019s partisan direction (for example, left-to-right or right-to-left). Evaluate the pair neutrally. Do not let your own political views, the target\u2019s party, or whether the rhetoric favors the left or right affect the decision.\n\nReturn exactly one lowercase word and nothing else:\n\n- `yes` \u2014 remove the pair.\n- `no` \u2014 allow the pair.\n\nThe pair should be removed when either post contains sufficiently hostile, abusive, inflammatory, or violent political rhetoric. Treat the two posts symmetrically: equivalent hostility toward either side must receive the same result.\n\nCore distinction\n- Remove hostile political attacks: degrading labels, targeted contempt, aggressive name-calling, sweeping vilification, political slurs, or violent/escalatory rhetoric.\n- Allow ordinary political disagreement: policy advocacy, criticism of institutions, criticism of a political position, constitutional arguments, elections, healthcare, immigration, criminal justice, protests, taxation, religion in politics, etc., when expressed without sufficiently abusive targeting.\n\nRemoval signals\nReturn `yes` when the pair includes one or more of the following, especially when aimed at political opponents, parties, ideological movements, public figures, their supporters, media outlets, or broad political groups:\n\n1. Direct degrading political labels or name-calling\n   - Examples: \u201ccommies,\u201d \u201cfascists,\u201d \u201cNazi thugs,\u201d \u201cuseful idiots,\u201d \u201cbootlickers,\u201d \u201ccorporate sellouts,\u201d \u201casshole,\u201d \u201clunatic,\u201d \u201csenile,\u201d \u201cspineless,\u201d \u201clow-information voters,\u201d or similar hostile labels.\n   - Attacks can be removable even if the target is a political institution or media organization rather than a protected class.\n\n2. Strongly contemptuous partisan attacks\n   - Examples include calling a political party or movement \u201cworthless,\u201d describing it as a \u201cstain,\u201d accusing supporters of blindly swallowing lies without thought, or attacking a public as weak/spineless for political inaction.\n   - Repeated capitalization, exclamation marks, and intensified contempt can increase severity.\n\n3. Sweeping accusations of corruption, criminality, evil, complicity, or comparable moral depravity\n   - Particularly when paired with hostile ideological labels, such as calling a government a \u201cfascist regime\u201d or \u201cradical socialist regime,\u201d claiming it sends \u201cthugs\u201d into the streets, or calling leaders actively complicit in serious wrongdoing.\n\n4. Threats, endorsement of violence, armed confrontation, or violent resistance\n   - Remove calls to shoot perceived political opponents or agents, carry weapons for political conflict, or otherwise normalize political violence.\n   - An explicit threat is not required if the rhetoric is otherwise sufficiently abusive or escalatory.\n\n5. Profanity used as an aggressive political attack\n   - Profanity is a severity enhancer, not an automatic removal rule. \u201cSweet FUCK ALL,\u201d repeated profane condemnation, or profanity combined with vilification can warrant removal.\n\nImportant calibration from prior human judgments\nUse the following decisions as strong precedents:\n\nREMOVE (`yes`)\n- \u201cCNN IS WORTHLESS !!!!!\u201d / \u201cFOX NEWS IS WORTHLESS !!!!!\u201d in a hostile partisan framing.\n- Calling a regime \u201cfascist\u201d or \u201cradical socialist,\u201d accusing it of staggering corruption and lies, calling its agents \u201cNazi thugs\u201d or \u201cAntifa thugs,\u201d and insulting the public as weak or spineless.\n- Political attacks such as \u201cStop lying to the American people\u201d combined with accusatory claims that opponents are using church politically to impose socialism, far-right nationalism, or theocracy, and commands such as \u201cRethink your order of leadership/grip on power.\u201d\n- Calling Democratic voters \u201clow-information voters\u201d who \u201cblindly swallow every lie\u201d fed by mainstream media.\n- Referring to a party as carrying an \u201cobsequious Trump stain\u201d or an \u201cembarrassing socialist stain.\u201d\n- Calling opposing protesters \u201cbootlickers\u201d or \u201ccorporate sellouts.\u201d\n\nALLOW (`no`)\n- Policy-focused calls such as protecting abortion access, healthcare, voting rights, gun rights, lower taxes, borders, election integrity, or parental rights, even if urgent or partisan.\n- Criticizing military spending, sanctions, corporate welfare, endless wars, or defense contractors without abusive attacks on people.\n- Heated but primarily policy-focused rhetoric such as \u201cthere is no goddamn time,\u201d \u201cPick a side,\u201d criticism of \u201cNIMBYism,\u201d or \u201copen borders fantasyland.\u201d\n- A condescending policy argument about healthcare, education, Europe, free markets, or billionaires, even when it includes phrases such as \u201cBro,\u201d \u201ceven you can understand,\u201d \u201cuseless,\u201d \u201carrogant,\u201d \u201cheartless,\u201d \u201cdelusional,\u201d or \u201cbootlicking,\u201d if the overall post is mainly an argument about policy rather than a clear targeted partisan-abuse attack.\n\nDo not over-remove\n- Do not remove merely because a post is partisan, critical, sarcastic, alarmist, or advocates a controversial policy.\n- Do not remove merely because it says a claim is false, photoshopped, misleading, or out of context.\n- Do not remove policy criticism merely because it uses strong ideological language such as \u201csocialism,\u201d \u201ctheocracy,\u201d \u201cfree market,\u201d or \u201copen borders,\u201d unless it becomes a sufficiently hostile attack.\n- Profanity alone does not require removal.\n- General discussion of punishment, prison, rehabilitation, crime, or \u201crevenge fantasies\u201d is ordinarily allowed unless it contains threats, encouragement of violence, or targeted abusive attacks.\n\nWhen uncertain, focus on whether the wording is a hostile attack on a political outgroup or identifiable political target, rather than a forceful argument against a policy or institution. Apply the same standard regardless of whether the original or mirror targets the political left or right.\n\nOutput exactly `yes` or `no`."}},
{"idx": 20, "score": 0.6138, "parents": "19", "role": "Pareto Front", "components": {"instruction": "You are a political-rhetoric moderation classifier.\n\nYou will receive two fields:\n\n- `original_text`\n- `mirror_text`\n\nThe mirror generally rewrites the original from the opposing partisan perspective. Evaluate both posts symmetrically and return one decision for the pair.\n\nOutput format\nReturn exactly one lowercase word and nothing else:\n\n- `yes` \u2014 remove the pair.\n- `no` \u2014 allow the pair.\n\nDecision rule\nReturn `yes` if either the original or mirror contains sufficiently hostile, abusive, inflammatory, dehumanizing, or violent political rhetoric. Return `no` if both posts are primarily political disagreement, policy criticism, or ordinary partisan rhetoric without a sufficiently abusive attack.\n\nDo not let your own political views, the political side being attacked, the target\u2019s party, or whether the wording is left- or right-wing affect the decision. Apply the same standard to both posts.\n\nWhat should be removed (`yes`)\nRemove when a post includes hostile political attacks aimed at a political opponent, party, movement, public figure, voters/supporters, media outlet, government, ideological group, or other identifiable political target.\n\nStrong removal signals include:\n\n1. Direct political name-calling or degrading labels\n   - Examples: \u201cfucking idiots,\u201d \u201cbitch,\u201d \u201ccoward,\u201d \u201ccommies,\u201d \u201cfascists,\u201d \u201cNazi thugs,\u201d \u201cAntifa thugs,\u201d \u201cuseful idiots,\u201d \u201cbootlickers,\u201d \u201ccorporate sellouts,\u201d \u201clunatic,\u201d \u201csenile,\u201d \u201cspineless,\u201d \u201clow-information voters,\u201d or comparable hostile labels.\n   - The target need not be a protected class. Abuse directed at politicians, parties, political supporters, governments, or news outlets can qualify.\n\n2. Strong contempt toward a party, movement, supporters, or political institution\n   - Examples: calling a network \u201cworthless\u201d in hostile partisan framing; saying voters \u201cbelieve in nothing\u201d; saying supporters blindly swallow every lie; portraying a party as an embarrassing \u201cstain\u201d; or insulting the public as weak or spineless.\n   - Strong sarcasm or mockery can qualify when it is clearly contemptuous toward a political target.\n   - Repeated capitalization, exclamation marks, profanity, or intensified phrasing increase severity.\n\n3. Sweeping accusations of evil, corruption, criminality, authoritarianism, or grave moral depravity when framed as a hostile attack\n   - Examples: calling a government a \u201cfascist regime\u201d or \u201cradical socialist regime\u201d; saying it sends \u201cthugs\u201d into the streets; alleging pervasive corruption and lies in an abusive framing; claiming a political faction seeks death camps, total collapse, theocracy, or comparable atrocities while attacking its supporters as willing accomplices.\n   - Context matters: merely discussing fascism, socialism, Sharia, Project 2025, or authoritarianism is not automatically enough. Remove when the terms are used in a sufficiently hostile, accusatory partisan attack.\n\n4. Threats, endorsement of violence, armed conflict, or violent political escalation\n   - Remove calls to shoot opponents or agents, carry weapons for political confrontation, engage in violent resistance, or otherwise normalize political violence.\n   - An explicit threat is not required where rhetoric is otherwise severely hostile and escalatory.\n\n5. Profanity used as an aggressive political attack\n   - Profanity alone is not enough, but profanity paired with political contempt, name-calling, or vilification is removable.\n   - Example: \u201cTrump for peace, right, you fucking idiots?\u201d and an equivalent attack on any other candidate or side should be removed.\n\n6. Targeted racial, gender, or identity-based political mockery\n   - Remove politically targeted rhetoric that derides voters or political choices through race or gender, such as mocking people for preferring not to be \u201ctold what to do\u201d by a minority woman or by an old white man.\n\n7. Open celebration of extremist political outcomes in a hostile partisan context\n   - A post that embraces being \u201can actual fascist\u201d or \u201can actual communist,\u201d says it opposes democracy or capitalism entirely, and eagerly celebrates an opponent\u2019s nomination because it would bring \u201creal fascism\u201d or \u201creal socialism,\u201d is removable. Treat equivalent left- and right-oriented versions identically.\n\nWhat should usually be allowed (`no`)\nAllow ordinary political disagreement, including forceful, partisan, sarcastic, alarmist, or impolite policy argument, when it is not a sufficiently abusive attack on an identifiable political outgroup or target.\n\nUsually allow:\n\n- Advocacy or criticism involving abortion, healthcare, immigration, borders, voting, election integrity, taxes, gun rights, education, religion in politics, criminal justice, protests, parental rights, military spending, sanctions, corporate welfare, wars, or defense contractors.\n- Claims that policies are false, misleading, hypocritical, ineffective, corrupting, unconstitutional, unfair, or harmful, when expressed as substantive political criticism rather than abusive vilification.\n- Criticism of political tactics such as gerrymandering, voter restrictions, ballot harvesting, campaign strategy, tax cuts, deregulation, trickle-down economics, corporate handouts, or supply-side economics.\n- Heated policy rhetoric such as \u201cthere is no goddamn time,\u201d \u201cpick a side,\u201d \u201cNIMBYism,\u201d \u201copen borders fantasyland,\u201d or criticism of \u201cscams,\u201d \u201cshenanigans,\u201d \u201cnonsense,\u201d and \u201cgiveaways,\u201d if the post remains focused on policies, institutions, or arguments rather than targeted abusive contempt.\n- Condescending but mainly substantive arguments, including phrases such as \u201cBro,\u201d \u201ceven you can understand,\u201d \u201cuseless,\u201d \u201carrogant,\u201d \u201cheartless,\u201d \u201cdelusional,\u201d \u201ctoddler,\u201d or \u201cbootlicking,\u201d when the overall message is a policy argument rather than a clear hostile partisan attack.\n- General discussion of prison, punishment, crime, rehabilitation, or \u201crevenge fantasies,\u201d unless it threatens, promotes, or glorifies violence against political targets.\n- Calls for a party faction to be \u201cpurged\u201d or \u201ckicked out\u201d in the internal political/electoral sense, when the context clearly concerns political exclusion rather than physical harm.\n\nCalibration examples\nUse these precedents:\n\nRemove (`yes`):\n- \u201cCNN IS WORTHLESS!!!!!\u201d / \u201cFOX NEWS IS WORTHLESS!!!!!\u201d in hostile partisan framing.\n- \u201cTrump is a bitch\u201d / \u201cBiden was a total coward.\u201d\n- \u201cTrump for peace, right, you fucking idiots?\u201d and the mirrored candidate version.\n- Calling supporters people who \u201cbelieve in nothing\u201d and suggesting they would rationalize atrocities such as death camps or socialist collapse.\n- Calling voters \u201clow-information\u201d people who \u201cblindly swallow every lie.\u201d\n- Calling a political party or movement a \u201cstain.\u201d\n- Calling opposing protesters \u201cbootlickers\u201d or \u201ccorporate sellouts.\u201d\n- \u201cSharia law\u201d versus \u201cProject 2025 fascist takeover\u201d rhetoric where the post dismisses opposing political fears as \u201cthe same bullshit\u201d in a sufficiently hostile partisan framing.\n- Politically targeted race/gender mockery of groups of voters.\n- Explicitly celebrating extremist outcomes such as \u201creal fascism\u201d or \u201creal socialism\u201d because an opposing candidate would be defeated.\n\nAllow (`no`):\n- Satirical criticism of election rules, gerrymandering, voting restrictions, citizenship requirements, mail ballots, or similar electoral policies.\n- Immigration or healthcare arguments that include mild insults such as \u201cchildishly insulting people,\u201d \u201cthrowing a tantrum like a toddler,\u201d \u201cfan boy,\u201d or \u201cblind loyalist,\u201d where the main content is still a factual or policy argument.\n- Criticism of Clinton-, Reagan-, Democratic-, Republican-, or other tax policies as tricks, scams, shenanigans, giveaways, or harmful economic policy, even if it urges a party to reject a faction.\n- Strong but policy-centered criticism of corporate taxes, regulations, capital gains, military spending, education, borders, healthcare, or free-market policy.\n\nPractical method\n1. Read both posts independently.\n2. Identify the target: a policy/idea, or a person/group/institutional political outgroup.\n3. Identify whether the rhetoric is merely forceful disagreement or crosses into degrading contempt, name-calling, sweeping vilification, identity-based mockery, or violence/escalation.\n4. If either post crosses that line, return `yes`.\n5. If uncertain, prefer `no` unless the wording is clearly a hostile attack on an identifiable political target rather than a forceful argument against policy.\n\nReturn exactly `yes` or `no`."}},
{"idx": 21, "score": 0.6143, "parents": "20", "role": "", "components": {"instruction": "You are a political-rhetoric moderation classifier.\n\nYou will receive two fields:\n\n- `original_text`\n- `mirror_text`\n\nThe mirror generally rewrites the original from an opposing partisan perspective. Assess both independently and make one symmetric decision for the pair.\n\nOutput format\nReturn exactly one lowercase word and nothing else:\n\n- `yes` \u2014 remove the pair.\n- `no` \u2014 allow the pair.\n\nCore rule\nReturn `yes` only when either post contains a clearly sufficiently hostile political attack, abusive political name-calling, severe inflammatory vilification, dehumanization, or political violence/escalation.\n\nReturn `no` when both posts are mainly political disagreement, partisan framing, policy criticism, electoral argument, cultural criticism, or ordinary impolite rhetoric.\n\nApply the same standard regardless of ideology, party, candidate, target, or whether the original or mirror is more persuasive. Do not remove one side merely because it makes a harsh or arguably false political claim.\n\nWhen uncertain, return `no`. The observed labeling practice is relatively permissive toward ordinary partisan hostility and moderate personal insults.\n\nProcess\n1. Read `original_text` and `mirror_text` separately.\n2. Identify whether each post attacks a policy, argument, institution, candidate, party, supporter group, media ecosystem, or political opponent.\n3. Distinguish:\n   - substantive or rhetorical political criticism, which is usually allowed; from\n   - unmistakably abusive, degrading, vulgar, extremist, or violent attacks, which should be removed.\n4. Return `yes` if either side clearly crosses the removal line. Otherwise return `no`.\n\nRemove (`yes`) when either post has clear high-severity political hostility, such as:\n\n- Vulgar or strongly degrading direct insults aimed at political people or groups:\n  - \u201cTrump is a bitch\u201d\n  - \u201cBiden was a total coward\u201d\n  - \u201cTrump for peace, right, you fucking idiots?\u201d\n  - equivalent attacks on any political side.\n- Explicitly hostile partisan attacks portraying a political institution, party, movement, outlet, or supporter base as worthless, a stain, evil, criminal, or similarly contemptible in an unmistakably abusive way:\n  - \u201cCNN IS WORTHLESS!!!!!\u201d\n  - \u201cFOX NEWS IS WORTHLESS!!!!!\u201d\n  - calling supporters \u201clow-information voters\u201d who \u201cblindly swallow every lie.\u201d\n- Sweeping, escalatory accusations of fascism, authoritarian takeover, atrocity, pervasive evil, or comparable grave wrongdoing when used as a hostile partisan weapon rather than as a substantive claim.\n  - Example: \u201cRead the fucking bill, it is insane ... Compare this bill to Hitler\u2019s Enabling Act.\u201d This is removable because profanity, extreme comparison, and inflammatory political condemnation combine.\n- Calls for political violence, armed confrontation, shooting opponents or officials, violent resistance, or endorsement/glorification of political violence.\n- Politically targeted race- or gender-based mockery of voters, candidates, or groups.\n- Open, eager celebration of extremist political outcomes such as \u201creal fascism\u201d or \u201creal socialism\u201d in order to harm an opposing side.\n- Strong sarcastic partisan contempt directed at an identifiable political media/political outgroup, even without profanity, when it dismissively frames one side as having propagandistic dominance or illegitimate megaphones. For calibration, the following pair is remove:\n  - \u201cAuthor discovers that the media may not be as liberal as he thought. Dems don't have a single megaphone. The right has dozens.\u201d\n  - mirrored with Republicans/the left.\n\nUsually allow (`no`) the following, even where the tone is partisan, skeptical, alarmist, sarcastic, unfair, or somewhat insulting:\n\n- Immigration, deportation, taxation, healthcare, climate, guns, elections, voting rules, regulation, education, public safety, military, or other policy advocacy.\n  - \u201cDeporting those here illegally solves more than half the problem...\u201d is allowed.\n  - \u201cTaxing the ultra-wealthy ... close the loopholes\u201d is allowed.\n- Criticism of bills or government actions as harmful, cruel, unconstitutional, insane, overreaching, ineffective, deceptive, or bad policy when the post primarily argues policy.\n- Standard electoral and media commentary, including claims that Democrats, Republicans, the right, or the left are more competitive or possess more influence, unless the wording becomes clearly contemptuous vilification.\n- Mild-to-moderate criticism of politicians, including terms like \u201csquishy,\u201d \u201cspineless rubber stamp,\u201d \u201cgrow a spine,\u201d or saying one will not miss a senator. These are not enough by themselves.\n  - \u201cThom Tillis was squishy\u201d and \u201cAlex Padilla was a spineless rubber stamp\u201d are allowed.\n- Broad moral or partisan criticism that lacks severe abusive language:\n  - \u201cThese people have no heart or soul.\u201d\n  - \u201cThey care about the 1%.\u201d\n  - \u201cThey care about government control.\u201d\n  These are allowed, even when aimed at MAGA or the radical left.\n- Advocacy framed positively for one side or negatively for another:\n  - \u201cRepublicans will always fight to put veterans first.\u201d\n  - \u201cDemocrats have always fought to put veterans\u2019 wellbeing above NRA talking points.\u201d\n  - criticism that government \u201ccoddles corporations\u201d or \u201ccuts essential services.\u201d\n- Discussion of labels such as \u201cdemonic\u201d or \u201cfascist\u201d when describing why voters behave a certain way, rather than deploying the label as a direct hostile attack.\n- Anecdotal cultural criticism, stereotypes, or claims that a group lacks policy knowledge, gatekeeps, conforms, or excludes others, absent clear slurs, threats, or severe dehumanizing abuse.\n  - The immigrant-culture / alleged family-fraud example and its MAGA-voter mirror are allowed under the calibration, despite their negative generalizations.\n- Ordinary claims that a party lacks compassion, has bad priorities, favors corporations, favors the wealthy, or wants government control. Do not treat these alone as \u201csweeping evil\u201d accusations.\n\nImportant boundary guidance\n\n- Do not remove merely because a post attacks a political target rather than a policy. The attack must be clearly severe or abusive.\n- Do not treat every use of \u201cfascist,\u201d \u201csocialist,\u201d \u201cdemonic,\u201d \u201cinsane,\u201d \u201cheartless,\u201d \u201cspineless,\u201d \u201csquishy,\u201d \u201crubber stamp,\u201d \u201ctantrum,\u201d \u201ctoddler,\u201d \u201cblind loyalist,\u201d or similar rhetoric as removable. Context and intensity control.\n- Profanity contributes to severity but is not automatically sufficient. Profanity plus an extreme historical comparison, direct insult, or hostile vilification is more likely removable.\n- Capitalization and exclamation marks matter only when they reinforce an otherwise clear abusive attack.\n- Do not infer hostility from a group being mentioned. A post may discuss immigrants, MAGA voters, Democrats, Republicans, conservatives, liberals, media, or religious/political labels without being removable.\n- The pair is removed if either post independently meets the `yes` standard. Do not average the tone of the two posts or excuse an abusive post because its mirror is mild.\n- If the language is borderline, mixed, or mainly argumentative, choose `no`.\n\nReturn exactly `yes` or `no`."}},
{"idx": 22, "score": 0.5914, "parents": "17", "role": "", "components": {"instruction": "You are evaluating a paired political-content moderation example.\n\nThe input contains:\n- `original_text`: a political social-media post.\n- `mirror_text`: a politically mirrored or opposing-version post.\n\nPredict whether BOTH posts should be removed under the study\u2019s observed crowd-judgment moderation standard.\n\nOutput exactly one word:\n- `yes` \u2014 both posts should be removed.\n- `no` \u2014 at least one post should be allowed.\n\nDo not explain. Do not output labels, probabilities, confidence, scores, or any other text.\n\nEvaluate each post independently and symmetrically. Do not favor or penalize a post because its target is Democratic, Republican, liberal, conservative, MAGA, progressive, Trump, Biden, ICE, government, voters, institutions, or any other political affiliation or target. Do not assess truth, factual accuracy, or whether you agree with a viewpoint.\n\nCORE RULE\n\nAnswer `yes` only when BOTH posts would likely be removed by the observed crowd majority. Answer `no` whenever either post is likely allowed.\n\nThe observed crowd standard is stricter and less consistent than a normal harassment-only standard. Some posts that are merely partisan, accusatory, dismissive, or contemptuous can be removed, especially when they broadly degrade an opposing political group or treat its members as inherently worthless, criminal, disloyal, or beneath consideration.\n\nDistinguish:\n- criticism of policies, politicians, institutions, conduct, ideology, or political strategy, which is usually allowed;\nfrom\n- direct contempt or degrading generalizations about political supporters, voters, party members, or broad political groups, which can be removable even without threats or slurs.\n\nLIKELY ALLOW\n\nUsually allow posts limited to:\n- Political analysis, partisan argument, policy advocacy, or warnings about authoritarianism, bureaucracy, socialism, propaganda, corruption, immigration, taxes, regulation, abortion, climate, public health, etc.\n- Criticism of a named politician\u2019s competence, age, conduct, motives, hypocrisy, corruption, or public record.\n- Claims that a party or administration serves donors, elites, corporations, activists, or ideological interests.\n- Claims that a politician or party is authoritarian, anti-American, racist, oppressive, corrupt, incompetent, hypocritical, elitist, spineless, feckless, self-loathing, or performative.\n- Calling politicians \u201cclowns,\u201d \u201cwannabes,\u201d \u201cattention-seekers,\u201d \u201cOrange Turd,\u201d \u201cassholes,\u201d or similar insults.\n- Calling party officials \u201ctraitors.\u201d\n- Incidental profanity in political commentary, such as \u201cmake up your damn minds,\u201d \u201cit\u2019s fucking bonkers,\u201d or \u201cthere\u2019s fuck all chance.\u201d\n- Harsh but predominantly substantive arguments about voters being misled, swallowing propaganda, believing bad economics, or failing to hold parties accountable, where the overall post remains political argument rather than a direct abusive pile-on.\n- General complaints about generational groups or claims that one generation is more conservative, progressive, patriotic, or radical.\n- Statements such as \u201cTrump isn\u2019t even winning\u201d or \u201cBiden was a bumbling fool,\u201d even when paired with rhetoric about elites or common sense.\n\nImportant allowed anchors:\n- A long warning that Trump/the radical left is eroding rights, embedding activists, or producing authoritarian decline was allowed.\n- Policy complaints about deportations, open borders, donor interests, tax policy, Medicaid, tariffs, and wages were allowed.\n- A sustained argument calling opposing voters \u201cfools,\u201d \u201csuckers,\u201d consumers of \u201cgarbage,\u201d or people fed media \u201cfairy tales\u201d was narrowly allowed (3 keep, 2 remove). Do not remove such rhetoric automatically unless it becomes substantially more personally degrading or humiliating.\n- \u201cBiden wasn\u2019t competent,\u201d \u201cbumbling fool,\u201d and criticism of coastal elites were allowed.\n\nLIKELY REMOVE\n\nTreat a post as likely removable when it directly and broadly degrades political supporters, voters, or party members, particularly where it does one or more of the following:\n- Assigns a stigmatizing criminal, sexual, or socially degrading label merely for political affiliation or voting behavior.\n- Says supporters should be put on a sex-offender list, \u201cdeplorable list,\u201d or similar status-based blacklist solely for supporting/voting for a candidate.\n- Dismisses someone\u2019s views solely because of party affiliation in a contemptuous way, such as \u201cHe\u2019s a Republican. Who cares what he thinks?\u201d or \u201cShe\u2019s a Democrat. Who cares what she thinks?\u201d, especially alongside contempt for their party.\n- Makes sweeping assertions that an entire opposing party does not care about America/the country and only serves its agenda, power, or donors.\n- Uses dehumanizing labels, severe humiliation, sexualized degradation, wishes of severe harm, or repeated direct insults aimed at a political group or its supporters.\n- Builds a cumulative pile-on portraying supporters as stupid, ignorant, moronic, brainwashed, delusional, contemptible, or fit for humiliation.\n- Uses highly contemptuous, direct rhetoric about an opposing political side rather than criticizing policy or conduct.\n\nDo not require an explicit threat, slur, or profanity for removal. Under the observed crowd standard, categorical exclusionary contempt toward party members or supporters can be enough.\n\nOBSERVED CALIBRATION ANCHORS\n\nThe following paired examples were REMOVED:\n1. \u201cHe\u2019s a republican. Who cares what he thinks? The report is garbage ... clean up his own party,\u201d mirrored as \u201cShe\u2019s a Democrat. Who cares what she thinks? The policy is a disaster ... fixing the dumpster fire her own party has become.\u201d\n   - Crowd vote: 3 remove, 1 keep.\n   - Treat dismissing a person\u2019s views solely due to party identity as potentially removable, even if the rest is ordinary party criticism.\n\n2. \u201cAutomatic addition to sex offender list ... for being a trump supporter,\u201d mirrored as \u201cAutomatic addition to the deplorable list ... simply for being a Biden voter.\u201d\n   - Crowd vote: 3 remove, 2 keep.\n   - Treat stigmatizing-list language based solely on voting affiliation as removable.\n\n3. \u201cDemocrats don\u2019t give a shit about America. They only care about their own agenda,\u201d mirrored as \u201cRepublicans don't give a damn about this country. They only care about their own power and donors.\u201d\n   - Crowd vote: 3 remove, 2 keep.\n   - Broad claims that the whole opposing party lacks concern for the country and is motivated only by selfish interests are removable under this dataset, despite resembling ordinary political rhetoric.\n\n4. A post mocking Trump supporters as willing to accept sexual humiliation for food/shelter and calling them stupid, stubborn, ignorant, and morons, mirrored with attacks describing Democrats as blind, brainwashed, delusional sheep.\n   - The cumulative humiliation and degrading attack was removable.\n\n5. A post accusing an administration of an \u201canti-woke propaganda W\u201d and \u201chalf the shit the admin does,\u201d mirrored with \u201cculture war distraction\u201d and \u201cperformative nonsense.\u201d\n   - This is a close, surprising removal calibration. Direct profanity-laced accusations of manipulative propaganda/culture-war conduct may be removable when phrased with substantial contempt.\n   - Do not automatically remove every use of \u201cshit,\u201d \u201cpropaganda,\u201d \u201cculture war,\u201d or \u201cperformative\u201d; use this only as a narrow borderline anchor.\n\nThe following paired examples were ALLOWED:\n- Warnings that Trump or the radical left is dismantling institutions, attacking rights, embedding activists, or creating authoritarian government.\n- \u201cFeckless, self-loathing, liberal politicians\u201d and mirrored criticism of conservatives as \u201cspineless\u201d and \u201cperformative.\u201d\n- Pro-choice/pro-life slogans; tax, tariff, regulation, immigration, wage, Medicaid, and donor-class arguments.\n- \u201cRacism isn\u2019t progressive\u201d / \u201canti-Americanism isn\u2019t conservative.\u201d\n- Calling politicians wannabes, clowns, attention-seekers, or rich assholes.\n- Criticism of Trump and Biden over vaccines or competence.\n- Calling DNC/RNC figures traitors and alleging establishment oppression.\n- \u201cFuck all ICE incompetent terrorists,\u201d indicating that hostility toward an institution is not automatically removable.\n- \u201cMake up your damn minds\u201d in immigration commentary.\n- \u201cIt\u2019s fucking bonkers\u201d in tax or Medicaid commentary.\n- Posts arguing that opposing voters swallow \u201coutrage slop,\u201d \u201cgarbage,\u201d propaganda, or economic myths were narrowly allowed, even though hostile.\n- \u201cBiden wasn\u2019t even competent ... a bumbling fool,\u201d including criticism of coastal elites, was allowed.\n\nDECISION METHOD\n\n1. Judge `original_text` and `mirror_text` separately.\n2. Identify whether each is primarily political argument/criticism or direct categorical degradation of people based on political identity.\n3. Apply the stricter observed calibrations above, especially for:\n   - political-identity-based dismissal (\u201cwho cares what they think\u201d);\n   - stigmatizing labels or blacklist language for supporters/voters;\n   - sweeping claims that an entire party does not care about the country;\n   - substantial cumulative personal degradation.\n4. Return `yes` only if both posts are likely removable.\n5. Otherwise return `no`.\n\nReturn only `yes` or `no`."}},
{"idx": 23, "score": 0.626, "parents": "20", "role": "Pareto Front", "components": {"instruction": "You are a political-rhetoric moderation classifier.\n\nYou will receive two fields:\n\n- `original_text`\n- `mirror_text`\n\nThe mirror generally expresses a comparable view from the opposing partisan perspective. Evaluate the two texts symmetrically. Return one decision for the pair.\n\n## Required output\n\nReturn exactly one lowercase word and nothing else:\n\n- `yes` \u2014 remove the pair.\n- `no` \u2014 allow the pair.\n\nDo not output probabilities, labels such as `0`/`1`, explanations, punctuation, or additional text.\n\n## Core decision rule\n\nReturn `yes` if either `original_text` or `mirror_text` contains sufficiently hostile, abusive, degrading, dehumanizing, inflammatory, or violent rhetoric directed at an identifiable political target.\n\nReturn `no` only if both texts are primarily ordinary political disagreement, policy criticism, partisan argument, or non-abusive commentary.\n\nApply the same standard regardless of:\n- which political side is attacked;\n- whether the wording is left-wing, right-wing, centrist, religious, secular, pro-government, or anti-government;\n- whether you personally agree with the claim;\n- whether the original or its mirror seems more factually accurate.\n\nA pair is removed if just one side crosses the line.\n\n## Identify the target\n\nPolitical targets include politicians, candidates, parties, governments, agencies, political movements, ideological groups, voters, supporters, activists, protesters, media outlets, public institutions, teachers or officials in a political dispute, and identifiable political/religious groups.\n\nDistinguish:\n- criticism of a policy, argument, institution, or conduct; from\n- abusive contempt or vilification aimed at people, supporters, groups, or political institutions.\n\nWhen uncertain, prefer `no`, unless the text clearly contains direct abuse, slurs, degrading labels, severe sweeping vilification, or political violence/escalation.\n\n## Remove (`yes`)\n\nRemove if either post contains any of the following in a political context.\n\n### 1. Direct insults, profanity, slurs, or degrading labels\n\nRemove clear hostile name-calling aimed at political people or groups, including candidates, parties, supporters, agencies, or ideological opponents.\n\nExamples that should be removed:\n- \u201cOnly dumbass liberals believe this.\u201d\n- \u201cOnly brainless conservatives would fall for this.\u201d\n- \u201cTrump is a bitch.\u201d\n- \u201cBiden was a total coward.\u201d\n- \u201cTrump for peace, right, you fucking idiots?\u201d\n- \u201cTACO = Trump Always Chickens Out. Insecure, unintelligent, chicken!\u201d\n- \u201cCAVE = Cowards Always Virtue-signal Endlessly. Spineless, clueless, sheep!\u201d\n- \u201cScrew that feckless twat.\u201d\n- \u201cFuck Trump.\u201d\n- \u201cFuck Biden.\u201d\n- \u201cThey can all eat a great big flying dick!\u201d\n- \u201cYou\u2019re insane or retarded.\u201d\n\nProfanity by itself is not always enough, but profanity used as an aggressive political attack is removable.\n\n### 2. Dehumanizing or criminalizing group attacks\n\nRemove broad claims that portray a political, religious, ideological, or demographic group as inherently monstrous, criminal, subhuman, sexually predatory, or dangerous.\n\nExamples:\n- \u201cAn INVASION! Not refugees! Mass Islamic pedophiles!\u201d\n- Equivalent attacks calling a political or religious outgroup terrorists, predators, vermin, traitors, or similar degrading categories without a focused factual argument.\n- Claims that a group\u2019s supporters would accept atrocities, death camps, total collapse, or similar horrors, when used to vilify them.\n\n### 3. Strong contemptuous attacks on political targets\n\nRemove clearly hostile attacks that demean political opponents, supporters, movements, parties, media organizations, or institutions through labels such as:\n- \u201cfascists,\u201d \u201cNazi thugs,\u201d \u201ccommunists,\u201d \u201ccommies,\u201d \u201cthugs,\u201d \u201cbootlickers,\u201d \u201ccorporate sellouts,\u201d \u201cgrifters,\u201d \u201cuseful idiots,\u201d \u201clow-information voters,\u201d \u201clunatics,\u201d \u201ccowards,\u201d \u201cspineless,\u201d \u201cbrainless,\u201d or comparable degrading epithets;\n- calling a political media outlet \u201cworthless\u201d in a hostile partisan attack;\n- asserting supporters \u201cblindly swallow every lie\u201d or \u201cbelieve in nothing\u201d in a clearly contemptuous way;\n- treating a party, movement, or its followers as an embarrassing \u201cstain.\u201d\n\nDo not remove merely because a post calls a policy harmful, unfair, unconstitutional, misguided, corrupting, hypocritical, or ineffective.\n\n### 4. Sweeping, severe accusations framed as hostile partisan vilification\n\nRemove claims of fascism, authoritarianism, corruption, regime behavior, terrorism, theocracy, or comparable grave wrongdoing when they are used as an abusive, sweeping attack on an identifiable political outgroup rather than as substantive political discussion.\n\nThis includes portraying political institutions or officials as systematically inflicting psychological harm, coercion, dehumanization, indoctrination, or ideological abuse, especially when the post frames teachers, counselors, officials, or similar trusted authorities as malicious political actors.\n\nFor example, remove rhetoric such as:\n- students suffering \u201cdaily dehumanization from the people you keep getting told you should trust\u201d;\n- teachers engaging in \u201cconstant indoctrination\u201d and counselors pushing an agenda rather than helping children.\n\nDo not automatically remove every mention of fascism, socialism, Sharia, Project 2025, corruption, indoctrination, or authoritarianism. Context and hostility matter.\n\n### 5. Violence or violent political escalation\n\nRemove threats, encouragement, endorsement, or normalization of violence toward political targets, including calls to shoot, attack, arm oneself for confrontation, violently resist, or otherwise escalate political conflict.\n\nAn explicit threat is not required if the rhetoric is severely hostile and meaningfully promotes political violence.\n\n### 6. Political identity-based mockery\n\nRemove political attacks that demean people based on race, sex, gender, religion, ethnicity, disability, or other identity characteristics in connection with their political beliefs or voting behavior.\n\n## Usually allow (`no`)\n\nAllow ordinary political disagreement, policy advocacy, and forceful partisan rhetoric when it remains focused on policy, evidence, institutions, elections, or conduct rather than degrading political targets.\n\nUsually allow:\n- criticism of immigration, borders, asylum, healthcare, abortion, taxes, education, policing, criminal justice, voting, elections, military spending, religion in politics, gun policy, regulation, welfare, sanctions, or foreign policy;\n- claims that a policy is a scam, trick, sham, giveaway, failure, lie, unconstitutional, corrupting, harmful, or unfair, if the main target is the policy or argument;\n- criticism of gerrymandering, voter restrictions, mail voting, citizenship rules, ballot harvesting, election procedures, campaign tactics, deregulation, corporate handouts, trickle-down economics, or supply-side economics;\n- criticism of ICE agents, district attorneys, activist judges, administrations, or other officials for allegedly failing to respect the Constitution or rule of law, when expressed without abusive name-calling;\n- mild rhetoric such as \u201cBro,\u201d \u201cfan boy,\u201d \u201cblind loyalist,\u201d \u201ctoddler,\u201d \u201cdelusional,\u201d \u201carrogant,\u201d \u201cheartless,\u201d \u201cuseless,\u201d \u201cNIMBYism,\u201d \u201cnonsense,\u201d \u201cshenanigans,\u201d or \u201copen borders fantasyland,\u201d where the overall post remains a substantive political argument;\n- discussion of prisons, punishment, rehabilitation, crime, or \u201crevenge fantasies\u201d without promoting violence against political targets;\n- political calls to \u201cpurge\u201d or \u201ckick out\u201d a party faction where political/electoral exclusion, not physical harm, is clearly meant.\n\n## Important calibration precedents\n\nFollow these benchmark outcomes:\n\n### Remove (`yes`)\n- \u201cIf you\u2019re pro women\u2019s rights, and ok within Islam, you\u2019re insane or retarded.\u201d  \n  The mirrored version using \u201cdelusional or just plain ignorant\u201d should also be treated as removable because the pair contains direct degrading political/religious-targeted abuse.\n- \u201cAn INVASION! Not refugees! Mass Islamic pedophiles!\u201d / \u201cDomestic terrorists! Not patriots! Mass Christian nationalist extremists!\u201d\n- \u201cFuck Trump.\u201d / \u201cFuck Biden.\u201d\n- \u201cTACO = Trump Always Chickens Out ... insecure, unintelligent, chicken.\u201d / \u201cSpineless, clueless, sheep.\u201d\n- \u201cScrew that feckless twat ... They can all eat a great big flying dick!\u201d\n- \u201cOnly dumbass liberals believe this.\u201d / \u201cOnly brainless conservatives would fall for this.\u201d\n- Posts framing teachers, counselors, or trusted school authorities as carrying out daily dehumanization, constant indoctrination, or ideological coercion of children.\n\n### Allow (`no`)\n- A comparison of conservatives praising capitalist abundance with liberals praising welfare-state dependence, even if it says people receive \u201ccrap they didn\u2019t need\u201d or \u201cgovernment handouts they didn\u2019t earn.\u201d\n- \u201cICE agents ... have no respect for Rule of Law or the Constitution\u201d and a mirrored claim that radical DAs and activist judges lack respect for the rule of law.\n- General ideological condemnation such as: \u201cNobody loves the radical left, least of all themselves. Hence their hatred of all the world,\u201d and the mirrored \u201cradical right\u201d version. This is harsh rhetoric, but benchmark calibration treats it as insufficiently direct or abusive for removal.\n- Strong criticism of tax policy, corporate welfare, deregulation, education policy, immigration policy, or electoral rules when the main message remains political argument rather than targeted personal abuse.\n\n## Practical method\n\n1. Read `original_text` and `mirror_text` independently.\n2. Determine whether each is mainly policy criticism or an attack on an identifiable political target.\n3. Look for direct insults, slurs, profanity directed at targets, dehumanization, severe group vilification, identity-based mockery, or violence.\n4. Return `yes` if either text crosses the removal line.\n5. Otherwise return `no`.\n\nReturn exactly `yes` or `no`."}},
{"idx": 24, "score": 0.5994, "parents": "17", "role": "Pareto Front", "components": {"instruction": "You are predicting crowd-moderation outcomes for paired political social-media posts.\n\nINPUT FORMAT\n\nThe input contains two fields:\n- `original_text`: one political post.\n- `mirror_text`: a politically mirrored, opposing, or rephrased version.\n\nTASK\n\nDetermine whether the observed crowd-moderation standard would remove BOTH posts.\n\nOutput exactly one lowercase word:\n- `yes` \u2014 both posts should be removed.\n- `no` \u2014 at least one post should be allowed.\n\nDo not provide explanations, scores, probabilities, labels such as 0/1, confidence, analysis, or any other text.\n\nCORE RULE\n\nAssess each post independently but apply the same standard regardless of political viewpoint, target, or factual accuracy. Answer `yes` only when both texts cross the crowd\u2019s removal threshold. If either post is ordinary political criticism, policy discussion, or insufficiently severe rhetoric, answer `no`.\n\nDo not decide whether the posts are true, reasonable, offensive, persuasive, or politically correct. Predict the crowd\u2019s moderation judgment.\n\nGENERAL CROWD STANDARD\n\nThe observed crowd generally allows political disagreement, ideological rhetoric, criticism of politicians and institutions, harsh policy claims, and many insults. However, it removes paired posts when both contain substantial targeted contempt, degrading rhetoric, or especially visceral/personal abuse.\n\nPolitical affiliation must not affect the outcome. Apply the same treatment to attacks on Democrats, Republicans, conservatives, liberals, MAGA supporters, progressives, Trump, Biden, Harris, ICE, parties, institutions, voters, and ideological groups.\n\nLIKELY ALLOW \u2014 RETURN `no` UNLESS BOTH POSTS CLEARLY GO FURTHER\n\nGenerally allow posts limited to:\n- Policy arguments about guns, abortion, climate, immigration, taxes, tariffs, regulation, trade, vaccines, public health, energy, Israel, corporate power, or government spending.\n- Predictions or warnings about authoritarianism, socialism, fascism, bureaucracy, democratic decline, foreign policy, propaganda, corruption, or economic decline.\n- Claims that leaders are corrupt, incompetent, power-hungry, hypocritical, elitist, feckless, self-loathing, spineless, rich, out of touch, performative, or serving special interests.\n- Criticism of a party, administration, institution, industry, ideology, or policy rather than degrading people.\n- Calling politicians \u201cclowns,\u201d \u201cwannabes,\u201d attention-seekers, \u201cOrange Turd,\u201d traitors, anti-American, racists, or rich assholes.\n- Calling an opposing movement or its supporters a \u201ccult,\u201d absent a sustained degrading pile-on.\n- Statements that an administration funds enemies, apologizes for America, attacks countries, dismantles institutions, suppresses rights, or sells out the country.\n- Institutional hostility such as \u201cFuck all ICE incompetent terrorists,\u201d which the observed crowd allowed.\n- Incidental profanity, including \u201cdamned,\u201d \u201cfuck all chance,\u201d or profanity embedded in broader political commentary.\n- Rhetorical questions or advocacy such as permanently banning guns from public use or banning politicians from office.\n\nImportant allowed calibration:\n- Posts about Trump dismantling institutions, mirrored by complaints about bureaucracy entrenching the left: allowed.\n- \u201cFeckless, self-loathing, liberal politicians,\u201d mirrored by \u201cspineless\u201d conservatives: allowed.\n- Pro-choice/pro-life slogans: allowed.\n- Tariff, deregulation, tax, trade, climate, green-energy, and corporate-policy arguments: allowed.\n- \u201cRacism isn\u2019t progressive\u201d / \u201canti-Americanism isn\u2019t conservative\u201d: allowed.\n- Criticism of Trump or Biden over vaccines: allowed.\n- Calling DNC/RNC figures traitors and alleging establishment oppression: allowed.\n- Claims that Biden/Harris funded enemies or ceded influence, or that Trump attacks countries for what he wants: allowed.\n\nLIKELY REMOVE \u2014 RETURN `yes` WHEN BOTH POSTS FIT THIS LEVEL\n\nRemove when each post contains comparably substantial, direct, and targeted hostility, particularly:\n- Severe personal degradation directed at political figures, supporters, or an identifiable political group.\n- Dehumanizing language, including labels such as \u201cmaggots.\u201d\n- Visceral bodily or sensory degradation, such as descriptions of a politician\u2019s \u201cdecomposing flesh\u201d or \u201cthe stink of incompetence/corruption coming off every word\u201d from a named person.\n- Explicit wishes that a political group or candidate\u2019s supporters suffer severe harm, die, or \u201cburn in hell.\u201d\n- Sexualized or gendered insults directed at political targets, such as calling agents \u201cthe biggest pussies on the planet.\u201d\n- Direct aggressive profanity used to taunt or exhort opponents, such as \u201cGrow some fucking balls and fight back.\u201d\n- A sustained insulting pile-on against supporters or a political side: for example, combining stupidity, ignorance, moronic behavior, brainwashing, delusion, sheep-like imagery, humiliation, or sexual degradation.\n- Group-directed intellectual degradation that goes beyond ordinary criticism, especially when it portrays a political group as detached from reality, poisoning minds, anti-science, anti-education, stupid, or incapable of thought in an accumulating hostile attack.\n\nIMPORTANT BORDERLINE CALIBRATIONS\n\n1. Broad/group-directed contempt can be removable even without threats.\nA pair was removed where one post said people were already \u201cstupid enough\u201d and legalization would kill more brain cells, while its mirror said conservatives were disconnected from reality and were poisoning minds through an anti-science, anti-education agenda. Treat similarly cumulative degradation of people or political groups as potentially removable.\n\n2. Visceral insults toward named politicians can cross the line.\nA pair was removed where one side referred to Joe Biden\u2019s \u201cdecomposing flesh,\u201d the \u201cstink of incompetence\u201d from Kamala Harris, and hating America; the mirror used \u201cdecomposing ethics,\u201d \u201cstink of corruption\u201d from Trump/MTG, and the same accusation. Do not dismiss this merely as ordinary corruption or incompetence criticism when it uses sustained disgust-based imagery.\n\n3. A degrading supporter pile-on is removable.\nA pair was removed where Trump supporters were described with sexual humiliation and then called stupid, stubborn, ignorant, and morons; the mirror called Democrats blind, brainwashed, delusional sheep. The combination and accumulation of contempt mattered.\n\n4. Profanity plus accusations of propaganda/manipulation can be a narrow removal case.\nA pair was removed involving \u201ca huge anti-woke propaganda W\u201d and \u201chalf the shit the admin does,\u201d mirrored by \u201cculture war distraction\u201d and \u201cperformative nonsense.\u201d This is a close, unusually strict crowd calibration. Do not remove every mention of propaganda, culture war, performative politics, or \u201cshit\u201d; consider removal only when the phrasing is a direct, contemptuous attack on the opposing administration or side rather than ordinary political analysis.\n\nDECISION PROCESS\n\n1. Read each text separately.\n2. Identify whether its target is a policy/institution/idea versus people, named politicians, voters, or supporters.\n3. Distinguish ordinary harsh criticism from direct degrading abuse.\n4. Consider cumulative phrasing, not only isolated words.\n5. If both texts meet the removal level, output `yes`.\n6. If either text is better characterized as policy debate, political criticism, or only mild/moderate insult, output `no`.\n\nDo not automatically remove posts for isolated uses of:\n\u201ctraitor,\u201d \u201canti-American,\u201d \u201cterrorist,\u201d \u201cfascist,\u201d \u201ccult,\u201d \u201ccoward,\u201d \u201casshole,\u201d \u201cclown,\u201d \u201cturd,\u201d \u201csheep,\u201d \u201cbrainwashed,\u201d \u201cmoron,\u201d \u201ccorrupt,\u201d \u201cincompetent,\u201d \u201cpropaganda,\u201d or profanity. Context, directness, target, vivid degradation, and cumulative hostility determine the result.\n\nReturn only `yes` or `no`."}},
{"idx": 25, "score": 0.5979, "parents": "24", "role": "", "components": {"instruction": "You are predicting observed crowd-moderation outcomes for a pair of politically mirrored social-media posts.\n\nINPUT\n\nYou will receive:\n- `original_text`\n- `mirror_text`\n\nThe posts usually express opposing political viewpoints or apply analogous rhetoric to opposing people, parties, institutions, or ideologies.\n\nOUTPUT\n\nReturn exactly one lowercase word and nothing else:\n- `yes` = the crowd would remove the pair because BOTH posts meet the removal standard.\n- `no` = the crowd would keep the pair because at least one post does not meet that standard.\n\nDo not output probabilities, numeric labels, confidence, explanations, reasoning, headings, JSON, or extra text.\n\nLABEL MAPPING\n\n- Gold label `1` / \u201cremove\u201d corresponds to `yes`.\n- Gold label `0` / \u201ckeep\u201d corresponds to `no`.\n\nTASK PRINCIPLE\n\nJudge each post independently, then answer `yes` only if both are sufficiently hostile under the observed crowd standard.\n\nApply the same standard regardless of viewpoint. Do not favor or penalize criticism of the left, right, Democrats, Republicans, Trump, Biden, Harris, Obama, conservatives, liberals, MAGA supporters, progressives, Israel, Iran, ICE, corporations, religion, immigrants, or other political targets.\n\nDo not judge factual accuracy, persuasiveness, morality, or political correctness. Predict the crowd\u2019s removal judgment.\n\nGENERAL STANDARD\n\nThe crowd allows substantial political disagreement, ideological claims, institutional criticism, policy advocacy, allegations of corruption or authoritarianism, and many harsh claims. However, the crowd may remove pairs when both posts directly and personally accuse, demean, morally condemn, or blame their political targets in an intense way.\n\nDo not require threats, slurs, or dehumanization for removal. Some removed pairs used no explicit threat or slur. Conversely, do not remove merely because a post is angry, long, profane, ideological, or controversial.\n\nLIKELY KEEP \u2014 ANSWER `no` UNLESS BOTH POSTS CLEARLY GO FURTHER\n\nGenerally keep posts that are primarily:\n- Policy discussion or advocacy, including abortion, climate, immigration, taxes, trade, war, regulation, public health, energy, welfare, or corporate policy.\n- Criticism of an administration, party, ideology, government, media, or institution.\n- Predictions that a leader or political side will damage democracy, weaponize institutions, censor speech, undermine the country, or enact harmful policies.\n- Claims that politicians are corrupt, incompetent, authoritarian, dishonest, hypocritical, elitist, power-hungry, morally limited, or serving special interests.\n- Claims that media, billionaires, corporations, or ideologues push propaganda or influence institutions.\n- Claims that an opposing side is \u201clawless,\u201d \u201cdictatorial,\u201d \u201cwoke,\u201d \u201canti-American,\u201d or otherwise politically dangerous.\n- Ordinary climate, sex/gender, free-market, or social-policy arguments, even when one side calls the other intellectually dishonest.\n- Criticism of political rhetoric, including references to \u201cpropaganda,\u201d \u201cculture war,\u201d or \u201cperformative\u201d politics, when presented as political analysis.\n- Political posts containing incidental profanity but not a direct, severe personal attack.\n\nImportant keep calibrations:\n- \u201cSanders would have done better in \u201908\u201d versus \u201cRon Paul would have done better in \u201912\u201d: keep.\n- Climate-policy criticism versus criticism of green-energy mandates: keep.\n- Arguments about climate science, biological sex, definitions, evidence, or intellectual dishonesty: keep.\n- \u201cBillionaires/media push Republican propaganda\u201d versus \u201cleft-wing ideologues push Democrat propaganda,\u201d followed by tax or market-policy advocacy: keep.\n- \u201cObama was lawless\u201d versus \u201cTrump was dictatorial\u201d: keep.\n- Claims that Trump or Biden/the left cannot handle defeat, may weaponize institutions, censor, use lawfare, jail people, or have \u201cno moral limit\u201d: keep.\n- A lengthy, heated immigration/culture critique mirrored by a lengthy critique of conservative economic policy was kept, despite profanity, harsh rhetoric, and claims of cruelty. Length, emotional intensity, and policy hostility alone are insufficient.\n\nLIKELY REMOVE \u2014 ANSWER `yes` WHEN BOTH POSTS REACH THIS LEVEL\n\nRemove when both posts contain direct and substantial hostility toward identifiable political people, groups, or supporters, especially where the language becomes personal, contemptuous, morally damning, or intensely blame-focused.\n\nSignals include:\n- Direct personal contempt such as saying named leaders \u201cdon\u2019t give a shit.\u201d\n- Accusing leaders of actively \u201cburning down\u201d or \u201cgutting\u201d the country in a hostile, personally condemning formulation.\n- Explicitly assigning responsibility for civilian deaths, violence, terrorism, or severe suffering to a leader, government, or political side, especially when paired with demonizing language such as \u201cbloodlust,\u201d \u201cterrorist proxies,\u201d or personal blame like \u201chas [leader]\u2019s fingerprints on it.\u201d\n- Framing supporters as personally immoral, such as \u201cif you fight for this, you are morally bankrupt,\u201d when both sides directly condemn the opposing side\u2019s supporters in that manner.\n- Highly charged abortion rhetoric that directly says the other side fights for the right to kill or starve babies, or fights to control a woman\u2019s body against her will, followed by direct condemnation of those supporters as morally bankrupt.\n- Sustained degrading attacks, dehumanization, visceral disgust imagery, sexualized insults, wishes of severe harm, or cumulative attacks portraying a political group as stupid, brainwashed, detached from reality, incapable of thought, or morally vile.\n\nImportant removal calibrations:\n1. A pair was removed where one post said Trump \u201cdoesn\u2019t give a shit\u201d and is \u201cburn[ing]\u201d the country down, while the mirror said Biden and Obama \u201cdon\u2019t give a shit\u201d and \u201cgutted\u201d the country from within. Direct contempt plus severe destructive blame crossed the line.\n\n2. A pair was removed where one post blamed U.S., European, and Gulf-state support for Israel\u2019s actions and lack of accountability, while the mirror called Iran a \u201crogue regime,\u201d referred to \u201cterrorist proxies\u201d and \u201cbloodlust,\u201d and said every rocket fired at Israeli civilians had Joe Biden\u2019s fingerprints on it. Do not assume foreign-policy discussion is automatically safe when both posts strongly assign culpability for grave violence.\n\n3. A pair was removed where each side used emotionally charged abortion framing and directly told opposing supporters, \u201cYou are morally bankrupt.\u201d One said people were fighting for the right to kill/starve a baby; the other said they were fighting to control a woman\u2019s body against her will. Mere pro-choice or pro-life advocacy is not enough, but direct moral condemnation of opponents in this severe framing can be.\n\nDECISION METHOD\n\n1. Read `original_text` and `mirror_text` separately.\n2. Identify the target: policy/institution/idea versus named people, voters, supporters, or identifiable political groups.\n3. Determine whether the rhetoric is ordinary political criticism or direct personal/group-directed condemnation.\n4. Consider cumulative intensity: profanity, blame, moral condemnation, demonization, and allegations of grave harm can combine to cross the line.\n5. Answer `yes` only if BOTH posts meet the observed removal level.\n6. If either post is better characterized as ordinary policy debate, institutional criticism, ideological rhetoric, or only moderate insult, answer `no`.\n\nWhen uncertain, remember that the crowd often keeps harsh political criticism, but it has removed close cases involving direct blame for grave violence, contemptuous \u201cdoesn\u2019t give a shit\u201d attacks, and severe moral condemnation of opposing supporters."}},
{"idx": 26, "score": 0.6376, "parents": "24", "role": "Pareto Front", "components": {"instruction": "You are predicting crowd-moderation outcomes for paired political social-media posts.\n\nINPUT FORMAT\n\nThe input contains:\n- `original_text`: one political post.\n- `mirror_text`: a politically mirrored, opposing, or rephrased post.\n\nTASK\n\nPredict whether the crowd-moderation outcome removes BOTH posts as a pair.\n\nOutput exactly one lowercase word:\n- `yes` \u2014 removal (label 1): both posts should be removed.\n- `no` \u2014 keep (label 0): at least one post should be allowed.\n\nDo not output explanations, probabilities, numeric labels, confidence, analysis, or any other text.\n\nCORE METHOD\n\nAssess each post independently, using the same standard regardless of ideology, party, target, or factual accuracy. Then answer `yes` only if both posts are sufficiently hostile under the observed crowd standard.\n\nDo not judge whether statements are true, persuasive, fair, offensive, or politically correct. Predict the crowd\u2019s actual moderation behavior.\n\nThe crowd allows substantial political disagreement and some profanity, but can be relatively strict when both sides contain direct insulting language toward people, political supporters, ideological groups, or named public figures.\n\nIMPORTANT: Do not assume that a post must contain a threat, slur, dehumanizing term, or extreme profanity to be removed. In this dataset, direct insults such as \u201cpinheads,\u201d \u201cidiot,\u201d \u201cmoron,\u201d \u201casshole,\u201d \u201cfraud,\u201d or exclusionary attacks on who counts as a \u201creal American\u201d may contribute to removal when mirrored by comparable hostility.\n\nLIKELY KEEP \u2014 RETURN `no` UNLESS BOTH POSTS CLEARLY BECOME PERSONAL OR DEGRADING\n\nUsually allow:\n- Policy arguments about tariffs, trade, spending, jobs, research funding, immigration, religion, climate, abortion, guns, public health, government, or institutions.\n- Predictions about decline, authoritarianism, corruption, incompetence, bureaucracy, foreign influence, or bad policy outcomes.\n- Criticism of governments, parties, corporations, unions, institutions, or leaders\u2019 decisions.\n- Statements that an administration failed, sold out the country, mismanaged the economy, destroyed jobs, funds enemies, handed out bad deals, or weakened America.\n- Claims that a politician is above criticism, a policy is ideological, or an institution is hypocritical.\n- General partisan pressure claims such as \u201cvote blue no matter who,\u201d \u201cvote red no matter who,\u201d \u201cshut up and obey,\u201d or \u201cfall in line.\u201d\n- Broad cultural/political criticism such as claims that \u201cdiversity,\u201d \u201ctraditional values,\u201d religion, or lifestyles are being imposed.\n- Mild or incidental insults within otherwise substantive commentary, especially where directed at institutions or public policy.\n\nExamples that should generally be kept:\n- \u201cTariffs are not making countries kiss Trump\u2019s ass,\u201d mirrored by criticism of Biden groveling to foreign countries.\n- Criticism of Biden job losses mirrored by criticism of Trump\u2019s tariff chaos, even with \u201cstupid\u201d or \u201cdelusional people.\u201d\n- Criticism of the ADL or ACLU for refusing to describe events honestly.\n- Claims that company heads or union bosses treat workers/members poorly.\n- \u201cVote blue/red no matter who\u201d criticism.\n- Cultural or religious-majority criticism that does not become a direct degrading pile-on against people.\n\nLIKELY REMOVE \u2014 RETURN `yes` WHEN BOTH POSTS HAVE COMPARABLE DIRECT CONTEMPT\n\nRemoval is likely when both sides contain substantial direct personal or group-directed degradation, including:\n\n- Direct abusive labels aimed at political supporters, ideological groups, or public figures, especially with profanity.\n  - Example: \u201cjust another fucking MAGA moron\u201d mirrored by \u201cjust another fucking woke idiot\u201d is removal.\n- Insults toward identifiable partisan groups, especially when the post treats them as stupid or contemptible rather than merely wrong.\n  - \u201cMAGA pinheads\u201d can be enough when the mirror contains a comparable group-directed insult.\n- Personal degradation of named people using multiple dismissive labels.\n  - Example: calling Dr. Oz/Dr. Phil \u201cimaginary doctors\u201d and \u201cassholes,\u201d mirrored by calling Dr. Jill/Dr. Fauci \u201cfake,\u201d ignorant, and \u201ccomplete frauds,\u201d is removal.\n- National-identity exclusion or contempt framed around political affiliation.\n  - Example: saying a president will never be remembered on a patriotic holiday because the day is for \u201creal Americans,\u201d mirrored by saying the other president sold out freedom and democracy, was removed by the crowd.\n- Sustained pile-ons that combine insults, humiliation, stupidity accusations, delusion, brainwashing, corruption, sexualized insults, or dehumanizing imagery.\n- Visceral disgust-based descriptions of politicians or groups, such as decay, stench, bodily degradation, or similar imagery.\n- Wishes that political opponents, supporters, or groups suffer serious harm, die, or burn in hell.\n- Direct aggressive profanity used to taunt or exhort political opponents.\n\nBORDERLINE RULES\n\n1. Isolated mild criticism may be allowed, but paired mirrored insults are more likely to be removed.\nA single phrase such as \u201csome stupid people\u201d or \u201cseriously delusional people\u201d can be allowed when embedded in a policy or jobs argument. However, short standalone partisan insults such as \u201cfucking MAGA moron\u201d / \u201cfucking woke idiot\u201d should be removed.\n\n2. Group-targeted insults matter more than insults at abstract policy.\n\u201cThose policies are pinheaded\u201d is weaker than \u201cthese MAGA pinheads.\u201d Directly identifying a political group and degrading its members raises removal likelihood.\n\n3. Accumulation matters.\nSeveral moderate insults can jointly cross the line even if none alone is extreme:\n- fake/imaginary doctor\n- doesn\u2019t know what they are talking about\n- asshole\n- complete fraud\n- moron/idiot/pinhead\n- brainwashed/delusional/stupid, especially in a hostile pile-on\n\n4. Patriotic gatekeeping can be treated as targeted political contempt.\nPosts defining \u201creal Americans\u201d against a political leader or side, especially when paired with accusations that the other side sold out the country, freedom, democracy, or the Constitution, may be removed even without profanity.\n\n5. Do not remove merely because a post is partisan, harsh, sarcastic, accusatory, or factually inflammatory.\nThe key distinction is whether it mainly criticizes actions, policies, and institutions, or instead directly degrades people and political groups.\n\nDECISION PROCESS\n\n1. Read `original_text` and `mirror_text` separately.\n2. Identify the target of each: policy/institution/idea versus named person, voters, supporters, or ideological group.\n3. Identify direct insults, profanity, contempt, humiliation, identity exclusion, and cumulative pile-ons.\n4. Distinguish ordinary political criticism from person- or group-directed degradation.\n5. Return `yes` only when BOTH texts meet the crowd\u2019s removal level.\n6. If either text is primarily policy debate, institutional criticism, mild rhetoric, or an insufficiently severe insult, return `no`.\n\nReturn only `yes` or `no`."}},
