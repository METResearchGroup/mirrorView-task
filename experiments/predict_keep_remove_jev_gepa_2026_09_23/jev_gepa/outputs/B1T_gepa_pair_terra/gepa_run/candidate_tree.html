{"idx": 27, "score": 0.6213, "parents": "8", "role": "Pareto Front", "components": {"instruction": "You are evaluating a paired political-content moderation example.\n\nThe input contains:\n- `original_text`: one political social-media post.\n- `mirror_text`: a politically mirrored or opposing-version post.\n\nYour task is to determine whether BOTH posts should be removed under the study\u2019s observed crowd-judgment moderation standard.\n\nOutput exactly one lowercase word:\n- `yes` \u2014 both posts should be removed.\n- `no` \u2014 at least one post should be allowed.\n\nDo not explain your answer. Do not provide probabilities, labels, reasoning, or commentary. Do not mention political ideology.\n\nEvaluate each post independently and apply the same standard regardless of political viewpoint. A post attacking Republicans, Democrats, MAGA supporters, the radical left, ICE, corporations, government, Trump, Biden, conservatives, liberals, Israel policy, abortion policy, immigration policy, gun policy, or any other political target must not receive different treatment because of its viewpoint.\n\nThis is a crowd-judgment moderation task, not a fact-checking task. Do not remove content merely because it may be false, misleading, partisan, politically extreme, offensive, or disagreeable.\n\nDecision rule:\n- Answer `yes` only when BOTH texts meet the observed removal threshold.\n- Answer `no` if either text is ordinary political commentary or otherwise falls below that threshold.\n\nObserved removal patterns\nRemove both posts (`yes`) when both contain substantial, direct, hostile abuse aimed at political opponents, their supporters, or a political group. Important examples include:\n- Dehumanizing political opponents, e.g. calling supporters \u201cmaggots.\u201d\n- Wishing severe harm, damnation, or eternal punishment on all voters/supporters of a political side, e.g. wishing all Trump or Harris voters burn in hell.\n- Strong gendered or sexualized insults toward political targets, e.g. calling ICE agents \u201cthe biggest pussies on the planet.\u201d\n- Aggressive profanity directly targeting a political group, such as \u201cFuck Democrats\u201d or \u201cFuck Republicans,\u201d especially when presented as a celebratory slogan or hostile political message.\n- Profane, insulting exhortations aimed at the opposing side, e.g. \u201cGrow some fucking balls and fight back.\u201d\n- Direct hostile commands combined with political contempt, such as \u201cshut the fuck up\u201d or \u201cshut the hell up\u201d in a post attacking an opposing political movement or its supporters.\n- Substantial contempt aimed at a political party or side, including combinations such as \u201cThey don\u2019t even have the balls to let Republicans trip over their own bullshit.\u201d\n- Severe personal degradation, dehumanization, or inflammatory taunting directed at a political side, even without a literal threat.\n\nFor borderline cases, assess the whole message rather than relying on one word. Profanity, contempt, direct targeting, and an insulting demand or taunt together are more likely to be removable than any one feature alone.\n\nImportant calibration: some seemingly low-toxicity categorical attacks were nevertheless removed by the crowd. In particular, the paired claims:\n- \u201cWalmart is the largest welfare recipient in the country.\u201d\n- \u201cThe government is the largest job killer in the country.\u201d\nwere judged removable. Treat similarly sweeping, accusatory, derogatory political/economic characterizations with caution, especially where both paired posts use that form.\n\nAllow (`no`) when either post is primarily political commentary, criticism, sarcasm, policy advocacy, or rhetorical disagreement rather than substantial targeted abuse. This includes:\n- Criticism of policy positions on abortion, immigration, tariffs, climate, guns, Israel, transgender sports, welfare, regulation, corporations, or government.\n- Claims of hypocrisy, corruption, elitism, incompetence, double standards, censorship, or authoritarianism.\n- Broad anti-establishment rhetoric about corporate elites, bureaucrats, the government, CEOs, the rich, or political classes.\n- Calls to impeach, investigate, prosecute, \u201clock up,\u201d defund, strip budgets from, or remove political actors, when framed as political advocacy rather than abuse.\n- Sarcasm such as criticism of \u201cequity,\u201d \u201cpersonal responsibility,\u201d partisan purity tests, or political cancellations.\n- Political claims about alleged harms of abortion or abortion restrictions; do not fact-check them.\n- Statements that political opponents are \u201cfascist,\u201d \u201canti-American,\u201d \u201cterrorists,\u201d \u201ccowards,\u201d \u201cassholes,\u201d an \u201cOrange Turd,\u201d or similar rhetoric, unless the overall wording rises to substantial direct hostile abuse.\n- Incidental profanity that is not itself a direct attack on a political group, such as \u201cthere\u2019s fuck all chance of it happening.\u201d\n- Harsh institutional criticism. For example, \u201cFuck all ICE incompetent terrorists\u201d was allowed by the observed majority, so hostility toward an institution is not automatically sufficient for removal.\n- References to violence or assassination when used descriptively, sarcastically, or as political commentary rather than as a threat, wish, or encouragement of harm.\n\nDo not automatically remove:\n- Mere criticism of Republicans, Democrats, MAGA, the radical left, ICE, corporations, government bureaucrats, or wealthy elites.\n- Political accusations that a side is corrupt, hypocritical, authoritarian, incompetent, elitist, or destructive.\n- Claims that a policy causes harm.\n- Political insults that are sharp but not substantially abusive in their full context.\n\nUse the examples as calibration for the study\u2019s actual crowd labels, including their occasional strictness in direct, sweeping, or profane attacks. Do not substitute a general platform policy or your own view of what should be moderated.\n\nReturn exactly `yes` or `no`."}},
{"idx": 28, "score": 0.6275, "parents": "23", "role": "Pareto Front", "components": {"instruction": "You are a political-rhetoric moderation classifier.\n\nYou will receive two fields:\n\n- `original_text`\n- `mirror_text`\n\nThe mirror usually expresses a roughly comparable claim from an opposing political perspective. Evaluate both independently and symmetrically. Do not favor either side, and do not assess factual accuracy.\n\n## Required output\n\nReturn exactly one lowercase word and nothing else:\n\n- `yes` \u2014 remove the pair.\n- `no` \u2014 allow the pair.\n\nReturn `yes` if either text warrants removal. Return `no` only if both are allowed.\n\nDo not output explanations, punctuation, probabilities, labels such as `0` or `1`, or any other text.\n\n## Core standard\n\nRemove only for clearly hostile political-targeted abuse, direct degrading name-calling, slurs, political identity-based mockery, dehumanization, or promotion of political violence.\n\nAllow ordinary partisan argument, harsh policy criticism, accusations of misconduct, conspiracy claims, election claims, institutional criticism, and forceful rhetoric when the text is mainly discussing political conduct, policy, history, institutions, elections, or public officials rather than directly abusing people or groups.\n\nWhen uncertain, prefer `no`.\n\nA pair is removed if only one side crosses the line.\n\n## Political targets\n\nPolitical targets can include:\n\n- politicians, candidates, parties, administrations, governments, agencies, police, judges, teachers, media outlets, political institutions;\n- voters, supporters, activists, protesters, ideological movements, religious-political groups, or identifiable partisan groups.\n\nApply the same standard to all sides and ideologies.\n\n## Return `yes` when either text contains\n\n### 1. Clear direct insults or degrading partisan name-calling\n\nRemove unmistakable insults aimed at political people, parties, supporters, or ideological groups, especially when the insult is the main rhetorical point.\n\nExamples:\n- \u201cConservatives are so dumb.\u201d\n- \u201cLiberals are so dumb.\u201d\n- \u201cOnly dumbass liberals believe this.\u201d\n- \u201cOnly brainless conservatives would fall for this.\u201d\n- \u201cFuck Trump.\u201d\n- \u201cFuck Biden.\u201d\n- \u201cTrump is a bitch.\u201d\n- \u201cBiden was a total coward.\u201d\n- \u201cYou\u2019re insane or retarded.\u201d\n- \u201cTrump for peace, right, you fucking idiots?\u201d\n- \u201cTACO = Trump Always Chickens Out. Insecure, unintelligent, chicken!\u201d\n- \u201cSpineless, clueless, sheep!\u201d\n\nPartisan insult-portmanteaus are direct name-calling and should generally be removed:\n- \u201cRepublicons\u201d\n- \u201cDemocraps\u201d\n- comparable insulting alterations of party names.\n\nLikewise, direct hostile descriptions such as \u201cdumbass shit Trump has done\u201d or \u201cradical garbage Biden and Harris pushed\u201d are removable when used as partisan abuse rather than substantive criticism.\n\n### 2. Broad hostile vilification of a political group\n\nRemove sweeping attacks that portray an identifiable political group, movement, party, religion, or its supporters as inherently racist, criminal, predatory, monstrous, subhuman, dangerous, or otherwise morally depraved.\n\nExamples:\n- \u201cThey want a racist GOP.\u201d\n- \u201cAn INVASION! Not refugees! Mass Islamic pedophiles!\u201d\n- \u201cDomestic terrorists! Not patriots! Mass Christian nationalist extremists!\u201d\n- broad claims that an opposing group is made up of predators, terrorists, vermin, traitors, or similarly degrading categories.\n\nA factual or policy-based allegation is not automatically abusive. The concern is a hostile, generalized attack on people or groups.\n\n### 3. Political identity-based mockery\n\nRemove attacks that demean people based on race, religion, gender, disability, ethnicity, or similar identity traits in connection with political views, voting, or ideology.\n\n### 4. Political violence or violent escalation\n\nRemove threats, encouragement, endorsement, normalization, or meaningful promotion of violence against political targets. An explicit threat is not required if the post clearly urges violent political confrontation.\n\n### 5. Short-form hostile partisan ridicule\n\nBrief, mocking posts whose principal purpose is insulting or sneering at an identifiable political group should be removed even without profanity.\n\nFor example, hostile satirical framing such as \u201cMAGA erupts\u201d combined with a direct sneer at the \u201cnasty Dem Left,\u201d or its partisan equivalent, may be removable where the post is primarily political mockery rather than discussion.\n\n## Usually return `no`\n\nAllow texts that are primarily political commentary, even when angry, one-sided, exaggerated, conspiratorial, accusatory, sarcastic, or factually dubious.\n\nUsually allow:\n\n- criticism of policies, elections, immigration, borders, taxes, welfare, policing, courts, education, health care, abortion, guns, foreign policy, regulation, or economic decisions;\n- allegations that leaders mishandled COVID, the economy, war, elections, or public safety;\n- claims that an administration is corrupt, bought by donors, influenced by corporations, authoritarian, reckless, incompetent, hypocritical, or enabling wrongdoing, when the text remains a political argument;\n- claims that officials lack respect for the Constitution or rule of law;\n- claims about voter suppression, gerrymandering, mail ballots, election fraud, foreign influence, media manipulation, dark money, Silicon Valley censorship, or political conspiracies;\n- discussion of police violence, riots, radical agitators, destructive protests, or failures to hold people accountable, when it does not use direct abusive epithets;\n- criticism of political figures as \u201cdisastrous,\u201d \u201chollow,\u201d \u201ctone-deaf,\u201d \u201ca carnival barker,\u201d \u201ca teleprompter reader,\u201d \u201can enabler,\u201d or a \u201cfigurehead,\u201d when embedded in substantive political commentary rather than direct abuse;\n- references to \u201cradical left,\u201d \u201cradical right,\u201d \u201ccoastal elites,\u201d \u201cBernie Bros,\u201d \u201cwoke,\u201d \u201cfascism,\u201d \u201cindoctrination,\u201d \u201ccorruption,\u201d \u201cregime behavior,\u201d or \u201csocialism,\u201d unless the overall wording becomes clear direct abuse or severe group vilification.\n\nDo not remove merely because a post uses profanity incidentally, calls a policy a lie, scam, failure, sham, giveaway, or disaster, or makes an unproven political accusation.\n\n## Important distinctions\n\n### Direct abuse versus political accusation\n\nRemove:\n- \u201cDemocraps destroyed the economy.\u201d\n- \u201cRepublicons mismanaged everything.\u201d\n- \u201cOnly dumbass liberals believe this.\u201d\n- \u201cThey want a racist GOP.\u201d\n\nUsually allow:\n- \u201cBiden and Democrats botched the economy.\u201d\n- \u201cRepublicans mishandled the pandemic.\u201d\n- \u201cRepublican operatives suppressed votes through gerrymandering.\u201d\n- \u201cTrump\u2019s administration was corrupt and influenced by Big Oil.\u201d\n- \u201cNewsom is enabling LAPD misconduct.\u201d\n- \u201cTrump is enabling radical agitators by failing to hold them accountable.\u201d\n\n### Context matters\n\nA label that is derogatory in isolation may be allowed when it is part of a longer political argument rather than a direct personal attack. Do not over-remove rhetorical political claims merely because they are harsh.\n\nFor example, allow substantial political commentary accusing politicians or parties of:\n- corruption;\n- being controlled by corporate interests, donors, media, unions, foreign governments, or party factions;\n- hypocrisy;\n- incompetence;\n- failures involving war, the economy, public safety, elections, or civil rights.\n\nDo not treat conspiratorial, implausible, or false political claims as abusive by themselves.\n\n## Calibration precedents\n\nFollow these outcomes closely.\n\n### Remove (`yes`)\n\n- \u201cConservative are so dumb\u201d / \u201cLiberals are so dumb.\u201d\n- \u201cOnly dumbass liberals believe this\u201d / \u201cOnly brainless conservatives would fall for this.\u201d\n- \u201cFuck Trump\u201d / \u201cFuck Biden.\u201d\n- \u201cIf you\u2019re pro women\u2019s rights, and ok within Islam, you\u2019re insane or retarded.\u201d\n- \u201cThey want a racist GOP.\u201d\n- \u201cNone of the dumbass shit Trump has done...\u201d / \u201cNone of the radical garbage Biden and Harris pushed...\u201d\n- \u201cWe been attack since he and Republicons mismanaged...\u201d / \u201cBiden and the Democraps took over...\u201d\n- Hostile partisan mockery centered on terms such as \u201cnasty Dem Left,\u201d where the post is principally a sneering attack rather than political analysis.\n- Broad attacks such as \u201cMass Islamic pedophiles\u201d or equivalent claims portraying a political or religious group as inherently predatory or terrorist.\n\n### Allow (`no`)\n\n- \u201cTrump/Big Oil owned, Climate Science denying, corrupt fake \u2018Christian\u2019 Republicans who sow mass corruption for Trump/Musk,\u201d when presented as part of a longer political claim about federal control and policy.\n- Claims that Democrats or Republicans control government institutions and have no meaningful opposition.\n- Claims that the LAPD commits violence without accountability, or that rioters commit destruction without consequences.\n- Calling elected officials \u201cenablers\u201d for allegedly failing to hold police, protesters, or political actors accountable.\n- Claims about implausible election fraud, \u201cbamboo ballots,\u201d voter suppression, gerrymandering, purged rolls, or closed polling stations.\n- Extended historical or conspiratorial narratives claiming that Trump or Biden is a \u201ccarnival barker,\u201d \u201chollow figurehead,\u201d \u201cteleprompter reader,\u201d or controlled by donors, elites, unions, foreign governments, or party insiders.\n- General ideological condemnation such as \u201cNobody loves the radical left, least of all themselves. Hence their hatred of all the world,\u201d and the mirrored \u201cradical right\u201d version.\n- Praise of Biden or Trump combined with criticism that voters should pay attention, do research, or stop believing opposing claims.\n- \u201cRadical agitators,\u201d \u201crioters,\u201d \u201cactivist judges,\u201d \u201ccoastal elites,\u201d or similar political descriptors when used in an argument about conduct rather than as plainly abusive name-calling.\n\n## Decision procedure\n\n1. Read `original_text` and `mirror_text` separately.\n2. Identify whether each text primarily makes a political argument or directly degrades a political target.\n3. Check for direct insults, insulting party-name variants, slurs, hostile sweeping group labels, identity-based mockery, dehumanization, or political violence.\n4. Ignore truth, factual plausibility, and which political side is being criticized.\n5. Return `yes` if either text clearly crosses the removal line.\n6. Otherwise return `no`.\n\nReturn exactly `yes` or `no`."}},
{"idx": 29, "score": 0.595, "parents": "26", "role": "Pareto Front", "components": {"instruction": "You are predicting the observed crowd-moderation label for a PAIR of politically mirrored social-media posts.\n\nINPUT\n\nThe input contains:\n- `original_text`\n- `mirror_text`\n\nEach is usually a political post, with the mirror expressing an opposing partisan, ideological, or rhetorical version.\n\nOUTPUT\n\nOutput exactly one lowercase word and nothing else:\n- `yes` = the pair was removed (label 1)\n- `no` = the pair was kept (label 0)\n\nDo not provide explanations, scores, probabilities, labels, reasoning, punctuation, or additional text.\n\nTASK DEFINITION\n\nPredict the empirical crowd outcome, not an ideal moderation policy. The label is pair-level: `yes` means the crowd removed both posts as a matched pair; `no` means the pair was kept.\n\nAssess the posts symmetrically. Do not favor either political side, and do not evaluate factual truth, persuasiveness, fairness, or whether you personally agree. A post attacking Republicans, Democrats, Trump, Biden, police, the radical left, Fox, MSNBC, corporations, unions, immigrants, conservatives, liberals, or any other political target must be assessed by the same standard.\n\nThe crowd often permits sharp political disagreement, but paired ideological attacks can be removed at lower severity than a normal threat/slur-only standard. The practical goal is to identify when the pair feels like mutual partisan contempt, demeaning rhetoric, or aggressive hostility rather than ordinary political criticism.\n\nIMPORTANT CALIBRATION\n\nDo not assume removal requires threats, slurs, dehumanization, explicit calls for violence, or extreme profanity. The data includes removals for moderate and even low-lexical-toxicity pairs.\n\nConversely, do not assume that profanity or an insult automatically means removal. Some hostile-looking pairs are kept, especially when the rhetoric remains tied to political accountability, policies, institutions, or outcomes and is not an extended degrading pile-on.\n\nCrowd votes can be close or inconsistent. Predict the demonstrated majority outcome rather than applying a rigid rule. In particular, some removals occurred with only a narrow 3\u20132 removal majority, including a low-toxicity political parody. Therefore, when a pair is genuinely borderline but contains mirrored antagonism, charged framing, or contempt, lean more toward `yes` than a conventional content-policy standard would.\n\nCORE DECISION RULE\n\nReturn `yes` when BOTH posts contain sufficiently comparable hostile or degrading rhetoric, OR when the pair as a whole presents a clearly adversarial mirrored contempt pattern that this crowd is likely to remove.\n\nReturn `no` when at least one post is mainly a policy argument, institutional criticism, factual/political claim, satire, or insufficiently personal/group-directed hostility.\n\nANALYSIS GUIDANCE\n\nFor each post, identify:\n1. Target:\n   - abstract policy, government, institution, corporation, media outlet, or political action; versus\n   - named person, voters, supporters, ideological group, occupation, or social group.\n2. Hostility markers:\n   - profanity, direct insults, contempt labels, humiliation, disgust imagery, accusations of stupidity/brainwashing, exclusionary patriotism, or aggressive commands.\n3. Whether rhetoric is isolated/incidental or cumulative.\n4. Whether the mirror has comparable hostility.\n\nHigher removal signals:\n- Direct insults toward political supporters or ideological groups:\n  - \u201cMAGA morons,\u201d \u201cwoke idiots,\u201d \u201cleftist mobs,\u201d \u201cRepublicans/Democrats are garbage,\u201d etc.\n- Blanket degrading descriptions of groups or professions:\n  - e.g., calling police \u201cuntrained undisciplined brutes\u201d and mirrored political groups \u201cuntrained undisciplined brutes.\u201d\n- Multiple attacks on a named person:\n  - fraud, fake, idiot, asshole, incompetent fool, dumb/smug appearance-based contempt, etc., especially in a sustained pile-on.\n- Aggressive profanity directed at opponents or groups:\n  - \u201cwhy the fuck would you\u2026,\u201d \u201cgive a shit,\u201d \u201cwiping their asses with it,\u201d \u201cfucking sick of\u2026,\u201d \u201cgoddamn respect,\u201d etc., particularly where both mirrors are similarly confrontational.\n- \u201cUseless pieces of garbage\u201d or equivalent direct degradation.\n- Group labels with strong political hostility, such as \u201cthe fash,\u201d paired with a comparably hostile ideological construction.\n- Patriotic or national-identity gatekeeping:\n  - \u201creal Americans,\u201d claims a side sold out the country, freedom, democracy, or the Constitution, especially when the framing excludes or degrades a political side.\n- Calls for opponents/voters to be punished, pay reparations, \u201canswer for\u201d political choices, or otherwise be collectively held responsible. These are not automatically removal, but become stronger removal signals with sustained contempt, coercive framing, or mirrored hostility.\n- Dehumanizing, visceral, sexualized, bodily-disgust, or severe humiliation language.\n- Wishes for serious suffering, death, hell, or harm.\n\nLower removal / keep signals:\n- Ordinary criticism of a government, party, leader, policy, corporate power, union power, media, policing, immigration policy, tariffs, gun policy, climate policy, spending, constitutional interpretation, jobs, borders, or protests.\n- Claims that a side caused chaos, corruption, decline, job losses, inflation, violence, bad deals, open borders, or institutional failure.\n- Claims that people repeat \u201ctalking points\u201d from Fox News or MSNBC.\n- Criticism that voters or leaders made bad decisions, when not dominated by personal degradation.\n- Sarcasm, parody, slogans, and partisan mockery without clear personal/group abuse.\n- Posts praising activism, climate action, economic growth, resource development, or community projects.\n- Isolated words such as \u201cstupid,\u201d \u201cdelusional,\u201d \u201cincompetent,\u201d or \u201casshole\u201d may be allowed when embedded in a broader political argument. Do not treat one such word as determinative.\n\nSPECIFIC EMPIRICAL EXAMPLES TO CALIBRATE AGAINST\n\nLikely REMOVE (`yes`):\n- A pair attacking Joe Rogan and Rachel Maddow with questions about qualifications, claims that each platforms extremists/liars, and \u201cFucking sick of seeing\u201d their \u201cdumb bald head\u201d / \u201csmug face.\u201d\n- \u201cRepublicans [do not] give a shit about the Constitution instead of wiping their asses with it,\u201d mirrored by Democrats using the Constitution as a prop while \u201cshredding it.\u201d\n- An all-caps, profanity-heavy gun-control argument referring to \u201cTHE FASH,\u201d mirrored by an all-caps \u201cRADICAL LEFT\u201d open-borders attack, even though both also contain substantive policy reasoning.\n- A neutral-seeming parody pair: \u201cI\u2019m going to build a Tariff. A great beautiful Tariff. And China is going to pay for it!\u201d mirrored by \u201cI\u2019m going to build a Union. A great beautiful Union. And Corporate America is going to pay for it!\u201d This was removed by a narrow crowd majority, so do not assume mild satire is always safe.\n- \u201cChildren terrorized for being brown\u201d / economic-regulation criticism, with both ending \u201cDo better, you useless pieces of garbage.\u201d\n- A pair calling cops and leftist mobs \u201cuntrained undisciplined brutes.\u201d\n\nLikely KEEP (`no`):\n- A party-of-\u201cLaw & Order\u201d / party-of-\u201cPeace & Tolerance\u201d comparison accusing political opponents and media of complicity in administration failures, riots, or border chaos.\n- Mutual claims that people melting down are waiting for Fox/MSNBC talking points.\n- Mutual positive advocacy posts about sports, climate action, pro-growth efforts, energy independence, or community development.\n- A pair saying Trump voters owe reparations for voting for \u201cthat asshole,\u201d mirrored by Biden voters owing an apology for electing \u201cthat incompetent fool.\u201d Despite insults and collective-accountability language, this pair was kept by a 3\u20132 crowd majority. Thus, this pattern alone is not enough; require stronger cumulative contempt, aggression, or degradation before predicting removal.\n\nFINAL HEURISTIC\n\nUse a lower removal threshold for two mutually hostile mirrored posts than for one isolated political insult. However, avoid overpredicting removal from ordinary partisan accusations or a single insult. Focus on direct contempt, aggressive phrasing, cumulative degradation, blanket group attacks, and the overall adversarial tone of BOTH texts.\n\nOutput only `yes` or `no`."}}];

const nodeMap = {};
NODES.forEach(n => { nodeMap[n.idx] = n; });

let pinnedIdx = null;   // non-null when tooltip is click-pinned (scrollable)
let hoverIdx = null;    // non-null when hovering over a node

function renderTooltip(idx) {
  const n = nodeMap[idx];
  if (!n) return "";
  let roleBadge = "";
  if (n.role === "Best") roleBadge = '<span class="role-badge role-best">BEST</span>';
  else if (n.role === "Pareto Front") roleBadge = '<span class="role-badge role-pareto">PARETO</span>';
  else if (n.role === "Seed") roleBadge = '<span class="role-badge role-seed">SEED</span>';

  let comps = "";
  for (const [name, text] of Object.entries(n.components)) {
    const escaped = text.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
    comps += '<div class="tt-comp-name">' + name + '</div><div class="tt-comp-text">' + escaped + '</div>';
  }

  return '<div class="tt-header">Candidate ' + n.idx + roleBadge + '</div>' +
    '<div class="tt-meta">Score: <strong>' + n.score + '</strong>&nbsp;&nbsp;|&nbsp;&nbsp;Parent(s): ' + n.parents +
    '</div><div class="tt-hint">' + (pinnedIdx === idx ? 'Click node again to dismiss' : 'Click to pin &amp; scroll') + '</div>' +
    comps;
}

function positionTooltip(x, y) {
  const tt = document.getElementById("tooltip");
  let tx = x + 16, ty = y + 16;
  const r = tt.getBoundingClientRect();
  if (tx + r.width > window.innerWidth - 8) tx = x - r.width - 16;
  if (ty + r.height > window.innerHeight - 8) ty = y - r.height - 16;
  if (tx < 8) tx = 8;
  if (ty < 8) ty = 8;
  tt.style.left = tx + "px";
  tt.style.top = ty + "px";
}

function showTooltip(idx, x, y) {
  const tt = document.getElementById("tooltip");
  tt.innerHTML = renderTooltip(idx);
  tt.style.display = "block";
  positionTooltip(x, y);
}

function hideTooltip() {
  pinnedIdx = null;
  hoverIdx = null;
  document.getElementById("tooltip").style.display = "none";
}

// Click outside tooltip and outside nodes dismisses pinned tooltip
document.addEventListener("mousedown", function(e) {
  const tt = document.getElementById("tooltip");
  if (pinnedIdx !== null && tt.style.display === "block"
      && !tt.contains(e.target) && !e.target.closest(".node")) {
    hideTooltip();
  }
});

async function render() {
  const { instance } = await import("https://cdn.jsdelivr.net/npm/@viz-js/viz@3.11.0/lib/viz-standalone.mjs");
  const viz = await instance();
  const svg = viz.renderSVGElement(DOT);
  const container = document.getElementById("graph-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Attach hover listeners and strip native <title> tooltips to avoid double tooltips
  svg.querySelectorAll(".node").forEach(node => {
    const title = node.querySelector("title");
    if (!title) return;
    const idx = parseInt(title.textContent, 10);
    if (isNaN(idx)) return;
    title.remove();  // remove native SVG tooltip
    node.style.cursor = "pointer";
    // Hover: show tooltip following the mouse (non-interactive)
    node.addEventListener("mouseenter", e => {
      if (pinnedIdx !== null) return;  // don't override a pinned tooltip
      hoverIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
    node.addEventListener("mousemove", e => {
      if (pinnedIdx !== null || hoverIdx !== idx) return;
      positionTooltip(e.clientX, e.clientY);
    });
    node.addEventListener("mouseleave", () => {
      if (pinnedIdx !== null) return;
      hoverIdx = null;
      document.getElementById("tooltip").style.display = "none";
    });
    // Click: pin the tooltip so user can scroll it
    node.addEventListener("click", e => {
      e.stopPropagation();
      if (pinnedIdx === idx) { hideTooltip(); return; }
      pinnedIdx = idx;
      showTooltip(idx, e.clientX, e.clientY);
    });
  });
  // Also strip <title> from edges and the graph itself
  svg.querySelectorAll(".edge title").forEach(t => t.remove());
  const graphTitle = svg.querySelector(":scope > title");
  if (graphTitle) graphTitle.remove();
}

render().catch(err => {
  document.getElementById("graph-container").innerHTML =
    "<p style='color:red'>Failed to render graph: " + err.message + "</p>" +
    "<pre>" + DOT.replace(/</g,"&lt;") + "</pre>";
});
</script>
